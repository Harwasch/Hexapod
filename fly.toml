# Fly.io configuration for the catalog API and the job worker.
#
# One app, one image (infra/api.Dockerfile), three process groups:
#
#   app     uvicorn, behind Fly's proxy and TLS      -- always on for Worlds cleanup, holds a ledger volume
#   worker  `python -m app.worker`, a poll loop      -- runs while there is work, holds a volume
#   research `python -m app.research`                 -- Land research queue
#
# Why Fly and not Cloudflare Containers, which would have consolidated this with Pages
# and R2 on one bill: docs/DECISIONS/0007-fly-for-the-api-cloudflare-for-the-edge.md.
# The short version is the worker. It is a poll loop that supervises runs measured in
# hours and holds a lease it must renew every WORKER_POLL_S; a runtime that sleeps
# instances on idle and bills per active CPU-millisecond is the wrong shape for it, and
# the workaround (cron-triggered wakeups) couples the worker to one provider -- which is
# the coupling app/worker/runner.py's runner seam exists to avoid. The static site and
# the buckets are still Cloudflare's (wrangler.toml, infra/cors/production.json).
#
# Since 2026-10 the worker does stop when it is idle -- but on its own terms, which is the
# difference: it exits 0 after WORKER_IDLE_EXIT_S with nothing running or queued (never
# mid-run, so nothing about the lease changes), the machine stays stopped, and the API
# starts it through the Machines API when it queues a job (app/services/worker_wake.py,
# FLY_API_TOKEN). With nobody polling, Neon's compute scales to zero too. ADR 0007's
# addendum has the reasoning.
#
# Deploy:  fly deploy --remote-only       (from the repository root, so the build
#                                          context is the repo -- the Dockerfile copies
#                                          apps/api/ *and* tools/pipeline, tools/captures)
# Secrets: never here. `fly secrets set` -- see docs/DEPLOYMENT.md § Handover.
#
# Deployed by the operator (twin-api, with the worker's volume at 20 GB rather than the
# initial_size below, which only applies when a volume is created). CI's `image` job
# asserts that every command named under [processes] and in release_command exists on
# PATH inside the image.

app = "twin-api"
primary_region = "iad"

# The worker is signalled, not killed: SIGTERM sets a stop flag, and on its next tick
# (WORKER_POLL_S, 2 s) the worker stops the recipe process, clears the lease on the job
# it holds and exits, so the next worker can take that job immediately instead of waiting
# the lease out. 30 s is fourteen ticks of headroom.
#
# These two are here, at the top, because TOML gives a bare key to whichever table header
# precedes it: written after [[http_service.checks]] -- which is where they read most
# naturally -- they silently become fields of the health check and Fly never sees them.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "infra/api.Dockerfile"

[deploy]
  # Migrations run here rather than on every machine boot. The image's own CMD runs
  # `alembic upgrade head && uvicorn ...` so that a plain `docker run` works, but on Fly
  # the process commands below replace CMD: two app machines booting at once would
  # otherwise race each other through the same migration, and the worker group would run
  # it a third time. A release command runs once, in its own machine, before any machine
  # is replaced, and a non-zero exit aborts the deploy.
  release_command = "alembic upgrade head"
  strategy = "rolling"

[env]
  APP_ENV = "production"
  # Production refuses to start with neither TILES_BASE_URL nor OBJECT_STORAGE_* set
  # (app/main.py), and refuses to start without API_WRITE_TOKEN. The token and the
  # bucket keys are secrets; these are not.
  ALLOW_PRIVATE_URLS = "false"
  API_PORT = "8000"
  # Personal-testing Worlds ledger: one API machine, on its own persistent volume.
  WORLD_DATA_DIR = "/worlds-data"
  WORLD_DATA_PERSISTENT = "true"
  WORLD_RUNPOD_ALLOW_PROVISION = "false"
  WORLD_LAMBDA_ALLOW_PROVISION = "false"
  WORLD_MODAL_ALLOW_PROVISION = "false"
  # R2 wants "auto"; a real region name signs for a host that is not there. True of any
  # R2 account, so it belongs here rather than in a secret. (What keeps presigning on
  # SigV4 is S3Storage passing signature_version explicitly, not this value -- see
  # docs/DEPLOYMENT.md, where that distinction matters more than it looks.)
  OBJECT_STORAGE_REGION = "auto"
  # App-wide, because fly.toml has no per-process env. The API never reads it (nothing
  # outside app/worker/ resolves a workdir), so on the app machines it is inert.
  #
  # /data is the volume mounted below, and it is mounted on the worker group only. A run
  # workdir survives the run on purpose: "retry from this stage" reads the outputs of the
  # stages that already succeeded out of it, and A6's checkpoint/ contract is worth
  # nothing once the directory is gone. Left on the machine's root filesystem instead,
  # every worker restart would throw that away -- the job is still safe (A7 reclaims the
  # lapsed lease and another worker starts the recipe over) but the work is not -- and a
  # 12 GB capture would be competing with the image's own layers for the root disk.
  WORKER_WORKDIR = "/data/worker"
  # Lane 2. `cloud` is `local` plus a GPU runner: every CPU stage still runs on the worker
  # (Lane 1 entirely, and Lane 2's frames, poses, georeference and packaging), and only
  # a stage that declares `gpu:` -- `pose` (cpu4) and `train` (l4) -- is sent to Modal, as the `run_stage_<tier>`
  # functions infra/modal/app.py deploys under the app name `twin-pipeline` (the worker's
  # default WORKER_MODAL_APP). It needs MODAL_TOKEN_ID / MODAL_TOKEN_SECRET, which
  # provision.yml forwards as Fly secrets. Without a deployed app a Lane 2 run should fail
  # at `train` on the function lookup (not yet observed); Lane 1 is untouched either way.
  # The phone key's salted PBKDF2 hash (app/services/phone_key.py). A hash, not the key,
  # which is why it can sit in a public file: 200,000 SHA-256 rounds per guess against
  # ~59 bits. Rotate by generating a new key and replacing this line.
  API_PHONE_KEY_HASH = "pbkdf2_sha256$200000$540675f0b3538e6c6a46379620b09ccc$7ba333cf98f74da149cc1c88daabf29645f265100c8f51f75fa36fb90b91816b"
  WORKER_RUNNER = "cloud"
  WORKER_CLOUD_PROVIDERS = "modal"
  # Jobs supervised at once. With "2" on 2026-09-27, jobs were reclaimed by the other slot
  # every ~40-60 s and dead-lettered after "stage 'normalize' has been attempted 3 times".
  # Cause (reproduced in tests; the Fly logs were not read): the lease was renewed only by
  # the supervising thread's heartbeat, and that same thread downloads the capture before
  # the first stage and uploads every finished stage (normalize's ~100 frames to R2)
  # before it records it -- each longer than the 30 s lease. Worse, its first heartbeat
  # after the download ran in a transaction opened before it, and `now()` + lease was
  # already past. One slot: nobody else was polling, so the lapse went unseen. Two: the
  # idle slot polls every 2 s, took the job, re-ran the stage as the next attempt (wiping
  # the out/ the first slot was still uploading), and the two slots traded it until the
  # budget ran out. Fixed in app/worker/claim.py: a per-job LeaseKeeper thread renews the
  # lease whatever the supervisor is doing, and a lease is computed from
  # statement_timestamp(), not now(). Guarded by tests/test_worker_concurrency.py (slow
  # uploads, slow download) and tests/test_worker.py. If it recurs, look for a second
  # "claimed job <id>" and "lost job" in the worker's logs.
  #
  # Still "1", and now deliberately rather than pending validation: a second general slot
  # could run two Lane 2 videos at once -- two GPUs billed, and two captures' inputs on a
  # volume sized for one (see [[mounts]]). What "2" was wanted for -- a one-minute
  # splat-ingest not waiting behind a two-hour training run -- is the CPU-only slot below.
  WORKER_CONCURRENCY = "1"
  # One more slot that claims only recipes with no `gpu:` stage (today `splat-ingest`),
  # worked out from the recipes when the worker starts. Two slots in all, so the lease
  # fix above is what keeps them from trading jobs. Memory: the worker README's figures
  # put the worst overlap -- Lane 2's ffmpeg (~0.45 GB) beside Lane 1's out-of-core
  # `package` of an 8M splat (~0.38 GB) -- near 1.1 GB with the supervisor, on 2 GB.
  WORKER_CPU_ONLY_SLOTS = "1"
  # Exit 0 after 15 minutes with nothing running or queued (the empty queue is polled
  # every 2 s for a minute, then backs off to every 30 s). The machine stays stopped --
  # Fly restarts the group only on a failure -- and Neon, with nobody polling, scales to
  # zero five minutes later. Queueing a job starts the machine again: the `app` group
  # needs the FLY_API_TOKEN secret for that (docs/DEPLOYMENT.md § Waking the worker),
  # and without it a stopped worker stays stopped until `fly machine start`. "0" polls
  # forever, the old behaviour.
  WORKER_IDLE_EXIT_S = "900"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m app.worker"
  research = "python -m app.research"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]
  # Worlds lease cleanup must continue when the browser disconnects.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  # Lane 1 (splat-ingest) runs its stages in this machine -- packing tiles, not training.
  # Lane 2's `pose` (Modal cpu4) and `train` (Modal L4) run elsewhere, so this machine
  # supervises rather than computes. With the CPU-only slot it may do both at once: one
  # Lane 2 run and one Lane 1 run, each in a recipe process of its own. Raise it when a
  # stage starts being the bottleneck; `fly scale vm` does not need a redeploy.
  size = "shared-cpu-2x"
  memory = "2gb"

[[mounts]]
  source = "twin_worker_data"
  destination = "/data"
  processes = ["worker"]
  # Captures are large and the workdir outlives the run. 50 GB is roughly four 12 GB
  # captures in flight, and that is what this asked for until the first real provisioning
  # run met Fly's answer: "To create more than 20GB in volumes please add a payment
  # method." So it starts at the ceiling an account without one is allowed, which is
  # about one and a half captures in flight rather than four.
  #
  # That is a starting size and not a decision about how much room the worker needs.
  # `fly volumes extend` grows it without a redeploy and without recreating anything, so
  # raising it later costs nothing but the command -- which is the reason this was the
  # cheap way out of the block rather than a compromise.
  #
  # 20 GB is enough for one capture in flight because the worker drops each finished
  # run's `inputs/` and stages' `work/` (WorkerConfig.tidy_finished_runs): what stays per
  # Lane 2 run is its outputs, a few hundred MB, while a run in flight briefly holds the
  # video, its candidate frames and COLMAP's database as well. That is also why there is
  # one general slot (WORKER_CONCURRENCY): a second video in flight is a second of those.
  # The CPU-only slot's splat-ingest beside it holds the uploaded splat, its normalized
  # copy, the packer's sorted working file (about the splat's size) and the tiles: a few
  # times the upload while `package` runs (not measured on this volume). A very large
  # ingest beside a very large video is the case that wants the volume extended.
  #
  # A volume binds the worker to one region and one machine, which is correct here: there
  # is exactly one worker, and a second one would not share this directory. A stopped
  # machine keeps its volume; an idle exit loses nothing in the workdir.
  initial_size = "20gb"

# Restart the worker when it dies -- an OOM kill, a crash at start-up against a database
# that was briefly away -- rather than leaving the queue with nobody to claim it until
# someone notices. `on-failure`, not `always`: a worker that exits 0 meant to (it ran out
# of work and is idling the machine down to save it), and `always` would start it straight
# back up and undo that. Ten tries, then Fly leaves it stopped; by then the cause is not
# going away on its own, and WORKER_HEARTBEAT_URL / QUEUE_CHECK_URL are what say so (a run
# that went quiet, a job queued and never claimed). A job the dead worker held is not
# lost either way: its lease lapses and the restarted worker resumes it, re-attaching to
# a GPU call it left running (apps/api/app/worker/README.md).
[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["worker"]

# Land research is independent from GPU/capture jobs and shares database/private storage.
[[vm]]
  processes = ["research"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[mounts]]
  source = "twin_worlds_data"
  destination = "/worlds-data"
  processes = ["app"]
  initial_size = "1gb"

[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["research"]
