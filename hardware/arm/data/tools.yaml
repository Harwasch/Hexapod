# End effectors on the wrist's quick-change flange. length is flange to tool centre point
# (TCP), cg is flange to the tool's centre of mass, both along the tool axis.
gripper:
  name: Fin-ray soft gripper (servo, TPU fingers)
  mass_kg: 0.22
  length: 0.11
  cg: 0.05
probe:
  name: Soil probe / stab rod (12 mm)
  mass_kg: 0.16
  length: 0.22
  cg: 0.08
sprayer:
  name: Micro-dose spray head (pump on the body)
  mass_kg: 0.09
  length: 0.07
  cg: 0.03
camera:
  name: Close-range sensing head (RGB + multispectral + ToF)
  mass_kg: 0.35 # a MicaSense-class multispectral camera is ~0.35 kg
  length: 0.05
  cg: 0.03
shears:
  name: Geared bypass shears (servo, ~10 Nm at the pivot)
  mass_kg: 0.40
  length: 0.13
  cg: 0.05
corer:
  name: Weed corer / twist tool
  mass_kg: 0.18
  length: 0.18
  cg: 0.07
