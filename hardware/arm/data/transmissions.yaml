# Reduction stages a turret-mounted motor can drive its joint through. Sources and
# derivations: docs/research/reductions.md (2026-10-17) and its verification. Everything
# here is an estimate from those design rules until the bench test in that report has run.
stages:
  # Pretensioned Dyneema DM20 rope from a grooved steel pinion to a smooth, flanged printed
  # PC drum fixed to the link. Zero backlash while pretensioned. Sandia measured 95%
  # forward on polished metal; printed drums and backdrive are unmeasured, so 0.92. Only
  # DM20 is used: the 1.5 mm rope that would fit a smaller drum is SK78, which creeps
  # and loses pretension outdoors. The drum sweeps a full circle about the shoulder axis, so
  # its outer radius must fit under the shoulder axis height (the turret plate is pocketed
  # under it). Only for the shoulder and a parallelogram's crank: the crank's reachable
  # range (~245 deg) fits a capstan sector; the yaw's +-200 deg does not.
  - kind: capstan
    joints: [shoulder, elbow]
    ratios: [3, 4, 5, 6, 7, 7.5, 8, 9, 10]
    ropes:
      # pinion core at D/d = 8, the rope maker's minimum (keeps ~85% of break strength)
      - { id: d20, name: 2 mm Dyneema DM20, d_mm: 2.0, mbl_n: 4000, pinion_core_mm: 16.0 }
    efficiency: 0.92
    backlash_deg: 0.0
    # torque limit 0.2 x (bent strength) x R keeps the peak strand at ~35% of it with
    # pretension = 0.75 x the torque-induced tension: ~20-35k cycles if every cycle peaks
    bend_strength: 0.85
    torque_fraction_of_mbl: 0.2
    flange_mm: 2.0
    # drum mass grows with R^2: 0.045 kg + 24 kg/m^2 x R^2 (0.10 kg at R = 49 mm)
    mass_kg: { base: 0.045, per_r2: 24.0 }
    # rope, 2-3 bearings, printed drum, steel pinion shaft, tensioner, magnet
    cost_usd: { base: 8.0, per_ratio: 1.0 }
    notes: >-
      Anchor the rope mechanically on the pinion (Dyneema friction is only 0.05-0.08);
      re-tension after ~50 and ~1,000 cycles; light-coloured cover against sun and grit.
  # A closed 3M 9 mm timing belt from a 15-16T pinion around a fixed toothed ring on the
  # deck: keeps the yaw's full +-200 deg. Gates rates a 3MGT 9 mm 16T pinion ~3.3 Nm; 60%
  # of that for a generic belt on a printed ring gives 2 Nm at the pinion.
  - kind: belt
    joints: [yaw]
    ratios: [4, 5, 6, 7, 8, 10]
    efficiency: 0.93
    backlash_deg: 0.5
    max_pinion_nm: 2.0
    mass_kg: { base: 0.07, per_ratio: 0.006 }
    cost_usd: { base: 10.0, per_ratio: 1.0 }
    notes: Printed ring and pinion measured 25-45 arcmin of backlash; tensioner idler on the turret.
