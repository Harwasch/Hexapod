# Actuators the optimizer may put at any joint. Curated from data/actuators_research.yaml
# (80 parts, single-unit US retail read from the vendors' stores on 2026-10-16/17; that
# file carries every source URL). Kept here: parts with an absolute output position
# (or a cheap option for one), at least one candidate per price/torque niche, and the
# hobby and stepper baselines the study compares against.
#
# rated_nm  continuous torque. For servos without a published rating: 35% of stall.
# peak_nm   peak/stall torque.
# speed_rpm rated output speed at the arm's 48 V bus (12 V for servos).
# backlash_deg  estimate by gear type (single-stage planetary 0.15-0.25, two-stage 0.3,
#               hobby servo 0.5-0.8, printed reducer 0.3-0.5); vendor figure where given.
# force_sense   yes = low-ratio and backdrivable, so motor current is a usable force
#               sensor; partly = backdrivable but coarse; no = not backdrivable.
# ratio         the part's own gear reduction (servo ratios are nominal).
# price_usd     list price at the source of the original read (mostly China-shipped, ex duty).
# landed_usd    what that order really costs delivered to the US: list x 1.403 (US duty on
#               Chinese motors, Oct 2026) + freight, or list + freight from a duty-paid
#               (DDP) seller. Parts without it get the same formula from costs.yaml.
# price_alt_usd the cheapest credible landed price for the same variant
#               (docs/research/sourcing.md, verified prices only), used with the "sourcing" lever.
