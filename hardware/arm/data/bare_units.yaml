# Bare motors and motor+gearbox units for the "custom electronics" lever: no driver of
# their own, run by the fleet's 3-axis turret board (FTD-3, docs/ELECTRONICS.md) at up to
# 40 A peak per axis, which also reads a motor-side and an output-side encoder.
#
# Sources: docs/research/custom_electronics.md and its verification (store reads 2026-10-17, aifitlab/Steadywin
# catalogues). Where a vendor's rated torque disagrees with its own torque constant
# (Kt x rated current), the smaller is used; peak never exceeds the vendor's stall torque
# and never needs more than 40 A. Motor-only units (WK*, GB*) are direct drive: they only
# make sense through a capstan stage on the turret. The WK kits come without a housing and
# carry +$8 / +80 g for a printed one and two bearings; the GB gimbal motors are housed.
# speed_rpm is a loaded estimate at 48 V.
# price_usd is the ex-duty list price (Steadywin direct or aifitlab, both ship from China
# duty unpaid); the landed price adds US duty and freight from costs.yaml.
units:
  - id: bare_gim4315_8
    name: Steadywin GIM4315-8 (bare)
    kind: qdd
    ratio: 8
    rated_nm: 1.1
    peak_nm: 8.0
    mass_kg: 0.343
    speed_rpm: 400
    price_usd: 58
    dia_mm: 57
    len_mm: 47
    backlash_deg: 0.25
    force_sense: yes
    backdrivable: yes
    interface: CAN-FD (our board)
    output_encoder: yes
    ip: IP54 (vendor claim)
    notes: "Vendor table contradicts itself (Kv implies Kt ~0.49, not 0.96): ~6-10 Nm peak, 1.1 Nm at its 45 W rating (verified 2026-10-17)"
