# Actuator catalog for low-cost outdoor arm (0.6-0.7 m reach, ~1 kg payload, ~2 kg arm mass)
# Compiled 2026-10-16/17 from live store data (Shopify products.json of the stores below) + official datasheets.
#
# CONVENTIONS
#   rated_nm   : continuous / nominal / "rated" torque at OUTPUT as published by vendor (null = vendor gives none)
#   peak_nm    : peak / stall / max torque at OUTPUT as published
#   ratio      : gear ratio (motor turns per output turn)
#   speed_rpm  : NO-LOAD (or vendor "max") OUTPUT speed at nominal voltage; rated-load speed is in notes
#   dia_mm/len_mm : round body -> diameter x axial length; square body -> side x depth; servos -> longest face x depth (full box in notes)
#   price_usd  : single-unit retail list price, USD, cheapest variant that includes a driver + bus interface.
#                Non-USD prices converted at assumed 1 EUR = 1.10 USD, 1 GBP = 1.30 USD, 1 JPY = 0.0067 USD (marked "?").
#                US prices may exclude import tariffs; several stores show "backorder".
#   Any value I could not verify is flagged in notes with a trailing "?".
#
# MAIN PRICE SOURCES (all fetched 2026-10-16/17)
#   aifitlab.com  (US reseller, USD, Shopify; widest Chinese-actuator catalog; prices updated 2026-10-17)
#   openelab.io   (EU reseller, EUR incl. VAT) / openelab.com (same company, USD)
#   store.cubemars.com (official, USD), mjbots.com (official), shop.odriverobotics.com (official),
#   hiwonder.com (official), robotis.us (official US distributor), shop.pimoroni.com (GBP)
# MAIN SPEC SOURCES
#   Damiao 2025 selection catalog PDF (official): https://www.worldrobotconference.com/profile/robot/download/2025/06/30/达妙科技DAMIAO - 2025年产品选型手册_20250630192546A441.pdf
#   Vendor spec tables reproduced on the aifitlab product pages (Steadywin, Robstride, CubeMars, MyActuator, LK, Feetech, HighTorque)
#   ROBOTIS e-manual (Dynamixel), hiwonder.com product pages, mjbots.com product pages

meta:
  compiled: "2026-10-17"
  kgcm_to_nm: 0.0980665
  fx_assumed: {EUR_USD: 1.10, GBP_USD: 1.30, JPY_USD: 0.0067}

actuators:

