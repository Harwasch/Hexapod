    speeds for both leg proportions, stability, and the actuator requirement: 68 N.m continuous,
    126 N.m for 10 min, 157 N.m peak, 9 rad/s, 170 x 42 mm, 1.1 kg, eighteen identical. With
    the reworked leg a single-stator PCB axial-flux motor closes the requirement at 55:1;
    two stators remain the fallback.'
