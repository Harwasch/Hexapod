- id: topology
  title: Leg topology trade and early architecture levers
  stage: topology
  summary: 'Four leg topologies under the same walking load over the same working volumes:
    the agreed sprawl yaw-pitch-pitch, the same leg with feet in, the mammal roll-pitch-pitch,
    and the sprawl with a roll hip (the first axis rotated 90 degrees). A vertical first axis
    never sees weight; a roll hip sees weight times the foot''s lateral offset and is the
    worst of both worlds. The sprawl wins on stance, roll margin and foot placement; the mammal
    wins on fold-ability and coaxial hip motors. Plus what a 300 mm step costs each leg proportion,
    and the architecture levers (mass, one motor three ratios, gravity compensation, series
    elasticity, driver per hip pod).'
  questions:
  - Does the topology trade answer the 'motor axis rotated 90 degrees' question to your satisfaction,
    and is the sprawl yaw-pitch-pitch leg confirmed?
  - 'Which of the architecture levers in 03-architecture-levers.md do you want carried into
    requirements now: gravity-compensation springs, series elasticity in the tibia, one driver
    board per hip pod, five-bar knee drive?'
  artifacts:
  - path: docs/design/02-leg-topology.md
    sha256: 167f3921efaae973
  - path: docs/design/03-architecture-levers.md
    sha256: 1a613a457b09945d
