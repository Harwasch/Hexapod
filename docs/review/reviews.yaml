- id: sizing
  title: Sizing with the agreed leg, rider as stretch, per-DOF actuator ratings (round 3)
  stage: sizing
  summary: 'Mass budget 49 kg unloaded. Rider reported as margin only. Each DOF rated over
    its working volume with the 3-D leg model: yaw 51 / 70, femur 115 / 226, knee 177 / 172
    N.m continuous / peak. The knee, not the femur, is the heaviest joint once the foot is
    raised, because the long tibia folds and the knee swings behind. Actuator plan: one PCB
    stator design, one stator at 45:1 for yaw, two stators at 50:1 for the femur and 75:1
    for the knee.'
  questions:
  - Is a knee rated at 177 N.m continuous acceptable, or should the routine working volume
    (0-150 mm foot lift under load) be tightened?
