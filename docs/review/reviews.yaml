# Human review sign-off ledger — written by `review-gate`.
#
# A stage is done when its review here says `approved` and no artefact
# has changed since. The digests are how staleness is detected; do not
# hand-edit them. To record a decision:
#
#   review-gate sign <id> --approve --by <name> --note "what they said"
#   review-gate sign <id> --changes "what they want different"
