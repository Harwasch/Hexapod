- id: actuator
  title: 'Actuator, round 11: cost search and motor market search'
  stage: design
  summary: 'Rounds 9-11 on the review''s ''exhaust all cost routes'': the stator laid out
    again with the coils under the whole magnet span (+14 % torque, so the cheap 2 oz boards
    match the 3 oz one and the magnets drop to 6 mm: unit 5.33 kg, 54 mm, $597 / $396 at 20
    / 100), the base as four laser-cut and tube parts, an N-S rotor on steel tried and rejected
    (+0.7 kg per unit for the same field). Then the design space searched as a whole (motor
    family, stator count, reduction, quantity, requirement) at the robot mass each option
    implies: the cost floor for the requirement as written is not the PCB machine but one
    off-the-shelf 8318-class outrunner through the 25-lobe cycloid and the 4:1 capstan, ~$420
    / $280 per unit on a 77 kg robot, subject to one bench measurement of the motor''s heat-sunk
    continuous current. The market search ranks seven OTS motors the same way: the 8318 100KV
    (~$50) and the Turnigy 9235-100KV ($75, published resistance) are the picks; premium drone
    motors and hub motors are excluded with numbers.'
  questions:
  - 'Motor family: the PCB two-stator machine we can make ($597 / $396, 5.3 kg, 124 kg robot,
    margin 1.10) or an OTS 8318/9235-class outrunner (~$420 / $280, 2.75 kg unit, 77 kg robot,
    margin 1.12 on an assumed heat-sink path)? The bench test that decides it is one motor
    on a plate at 30 A with a thermocouple.'
  - 'If the PCB machine stays: rebuild its rotor from sheet parts and standoffs (two Halbach
    rings back to back, no middle carrier, no turned drum)?'
  - 'The continuous load case as written (30° slope, dyn 1.5, all day) is the largest cost
    lever left: it forces two stators or the outrunner. Keep it as the requirement, or make
    level walking at dyn 1.2 the continuous case and the slope a minutes-long rating?'
