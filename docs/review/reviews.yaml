- id: bio
  title: 'Bio-inspiration: what real hexapods do and what transfers'
  stage: bio
  summary: 'A study of the insect leg (coxa, trochanter, femur, tibia, tarsus; the slanted
    thorax-coxa axis, the coxa-trochanter power joint, the femur-tibia posture joint), the
    cockroach''s ground reaction forces (every leg carries half the body weight, lateral and
    fore-aft forces 35-52 % of vertical, aimed at the coxa to minimise joint moments), tripod
    static stability, passive tarsus and spines, strain sensing in the cuticle, the Biewener
    size-posture scaling, and the crevice posture. Each mapped to our design: what we already
    have, what to add (compliant clawed foot, tibia elasticity, strain gauges, a flat posture),
    what not to copy (the slanted first axis), and one reframing: the mammal stance is nature''s
    posture at our size, so it may be the cruise mode and the sprawl the terrain mode.'
  questions:
  - 'Which of the additions go into requirements now: passive compliant foot with claws or
    spines, elastic element in the tibia, strain gauges on the tibia and coxa, a flat splayed
    posture?'
  - Do you accept the reframing that the mammal stance is the economical cruise posture and
