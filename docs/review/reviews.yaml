- id: sizing
  title: Top-level sizing and the actuator requirement
  stage: sizing
  summary: 'Mass budget (49 kg unloaded, 149 kg with a rider), load cases, joint torques and
    speeds for both stances, stability, and the actuator requirement that falls out: 92 N·m
    continuous, 151 N·m for 10 min, 179 N·m peak, 9 rad/s, Ø170 x 42 mm, 1.1 kg, eighteen
    identical. First check of the PCB axial-flux motor with in-plane cycloid: two stators
    at 50:1 close the requirement, one does not.'
  questions:
  - Is 1.1 kg per actuator and 49 kg unloaded a budget you accept, or should the robot be
    lighter and the rider case go?
  - Are the dynamic factors (1.5x walking, 3x stumble) and the 30 degree slope the right conservatism
    for the terrain demo?
  - Do you accept two stator PCBs per motor at 50:1 as the nominal actuator architecture to
    take into the actuator stage, with 1 m/s as the speed target and 2 m/s dropped?
