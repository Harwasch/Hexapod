- id: actuator
  title: 'Actuator, round 5: the parts as designed'
  stage: design
  summary: 'The A3 actuator designed as parts, not models: a 36-coil 12-layer 3 oz stator
    board laid out with KiCad''s API (DRC clean, gerbers; a 16-layer 2 oz JLCPCB fallback
    rated alongside), the Halbach rotor field simulated with off-the-shelf 30x8x5 N48H blocks
    (0.95 T at the board, 2.3 kN pull between rotors), the unit modelled in build123d (fixed
    pin cylinder through an open-bottom rotor cup, one 10 mm cycloid disc on an HK2512, RB5013
    crossed-roller output in the mounting face: 38.7 mm tall but Ø186, 3.41 kg), the stator
    thermal network from that geometry (0.80 K/W copper to housing; the body''s cooling, not
    the motor, sets the sustained torque), and a bill of materials at about $1.3k per unit
    at one-off prices. Femur and knee both 60:1 on one disc blank (153 N·m continuous against
    135 / 143 needed); yaw 30:1.'
  questions:
  - The unit came out Ø186 instead of Ø170 because the board's phase rings and clamp sit outside
    the magnets. Accept Ø186, or spend a round moving the interconnect to the bore side?
  - 'A femur/knee unit is 3.4 kg in the CAD against the 1.1 kg the mass budget carried (18
    units: 60 kg instead of 20). Renegotiate the mass budget, or cut the joint torque requirement?'
  - One cycloid disc fits the 42 mm height but puts 12.8 kN on the needle bearing at the femur
    peak (about 100 h L10 at the continuous rating, 2000 h at walking loads). Keep one disc
    at 39 mm, or two discs at 52 mm?
  - The canonical stator needs a 3 oz 12-layer board (PCBWay-class); the 2 oz 16-layer JLCPCB
    fallback gives 11 % less torque and needs the knee at 65:1. Which board do we order first?
  - Sustained torque with all joints active is set by the body's ability to shed ~300 W, about
    half the per-joint rating. Is that acceptable for the terrain demo, or do the hip pods
    get forced air?
