- id: topology
  title: Topology confirmed; motor and reduction options
  stage: topology
  summary: 'The sprawl leg confirmed in review, now with its mammal stance evaluated as a
    fifth configuration in the trade (100 % of the step-up box reachable, yaw nearly idle,
    pitch joints take the propulsion). New: 04-motor-reduction-options.md surveys motors (PCB
    stator, wound flat-coil, iron-core axial, radial outrunners, frameless) and reductions
    (cycloid, compound cycloid, planetary, harmonic, capstan, belt) on torque per kg, cost
    and in-house buildability. Verdict: keep PCB plus cycloid for the first build, design
    the housing for a wound flat-coil stator swap and a second cycloid disc, build the first
    leg on bought actuators, and look at a capstan or belt stage along the coxa.'
