      two 8-layer 2 oz JLCPCB boards per stator position instead of a 12L 3 oz board, laser-cut
      hardened discs, 6061 and laser-cut housing parts, a Chinese crossed roller, an ODrive-compatible
      driver, volume magnets — $660 per unit against $1,690 (estimates at 20 units, verified
      lines marked). The closure re-check with the cheaper boards at 80:1 total closes at
