# Which phases the review page shows, and what goes in each.
#
# Vision, plan, requirements and architecture are built automatically
# from the repo and need nothing here. Everything below is a design
# stage: it appears on the page only if it is listed.
#
# Regenerate the page with `review-artifact`, and check it with
# `review-artifact --check` before you publish it.
title: Hexapod
subtitle: >-
  A large-dog-sized outdoor hexapod with all eighteen motors in the body.
  Round 6: the actuator as parts (board, rotor field, CAD, thermal, BOM),
  rebuilt to the review's decisions — two discs, Ø186, the mass budget
  renegotiated — and the closure loop that decision opened: one stator or two.

phases:
  - id: geometry
    title: Drawings
    eyebrow: Stage 1 · dimensioned geometry
    after: vision
    images:
      - docs/design/drawing/top.png
      - docs/design/drawing/front.png
      - docs/design/drawing/side.png
      - docs/design/drawing/hip-stack.png
    captions:
      docs/design/drawing/top.png: >-
        Body, hip stacks, batteries and all six legs at the sprawl neutral
        stance, from above. Look at: the hip spacing, the foot circle each
        leg can reach, and the ±30° yaw of the front and rear leg planes.
      docs/design/drawing/front.png: >-
        Front view of the sprawl stance with a 6 ft figure. Look at: hip,
        knee and deck heights, and the coxa / femur / tibia lengths.
      docs/design/drawing/side.png: >-
        Side views of both stances of the same robot. Look at: how much
        taller the mammal stance stands, and the stance lengths.
      docs/design/drawing/hip-stack.png: >-
        Section through one hip: three coaxial pancake actuators, the yaw
        output through the floor and the coxa. This is the volume the motor
        study has to fill.
    docs: [docs/design/06-geometry.md]

  - id: sizing
    title: Sizing
    eyebrow: Stage 1 · analysis
    after: vision
    images:
      - docs/design/sizing/leg-stance.png
      - docs/design/sizing/torque-map.png
      - docs/design/sizing/ratio-trade.png
    captions:
      docs/design/sizing/leg-stance.png: >-
        One leg in its own plane at the rider load (585 N per foot), both
        stances. The tibia is near vertical under load, so the femur joint
        carries almost everything. Look at: is 80 / 300 / 400 mm the right
        leg, and is a knee-up leg what you want?
      docs/design/sizing/torque-map.png: >-
        Femur and knee torque over the foot workspace at the rider load.
        Contours are the continuous / 10-minute / peak ratings. Look at:
        how much of the workspace the controller must fence off under a rider.
      docs/design/sizing/ratio-trade.png: >-
        What a Ø170 mm PCB axial-flux motor gives at the joint through an
        in-plane cycloid, one or two stators, against the requirement bands.
        Look at: a single stator does not close at 50:1; two do, and 2 m/s
        is out of reach either way.
    docs: [docs/design/01-sizing.md]

  - id: topology
    title: Leg topology
    eyebrow: Stage 1 · trade study
    after: sizing
    images:
      - docs/design/topology/torques.png
      - docs/design/topology/step-up.png
    captions:
      docs/design/topology/torques.png: >-
        Joint torque each topology sees over the routine working volume under
        the walking load, and at the neutral stance. Look at: which joint the
        weight levers against, and the sum, which is what the actuators weigh.
      docs/design/topology/step-up.png: >-
        What a 300 mm step costs each leg proportion: the foot has to move
        outward to clear the leg's minimum extension, and the femur pays for
        the reach. Look at: the 625 mm tibia's fold limit.
    docs: [docs/design/02-leg-topology.md, docs/design/03-architecture-levers.md, docs/design/04-motor-reduction-options.md]

  - id: bio
    title: Bio-inspiration
    eyebrow: Stage 1 · study of nature
    after: topology
    images:
      - docs/design/bio/insect-leg.png
      - docs/design/bio/grf-direction.png
    captions:
      docs/design/bio/insect-leg.png: >-
        An insect leg and ours drawn to the same scheme. The insect's three
        joints map onto our yaw, femur and knee almost one to one; what we
        lack is the tarsus. Look at: the slanted first axis, and the power
        joint being the second one in both.
      docs/design/bio/grf-direction.png: >-
        The cockroach's trick computed on our leg: pushing the foot inward as
        well as down points the ground reaction force at the femur axis and
        takes the femur torque to zero. Look at: the friction it needs.
    docs: [docs/design/05-bio-inspiration.md]

  - id: actuator
    title: Actuator
    eyebrow: Stage 2 · motor and reducer design
    after: bio
    images:
      - docs/design/motor/torque-density.png
      - docs/design/actuator/stator-F_Cu.svg
      - docs/design/actuator/rotor-field.png
      - docs/design/actuator/cad-femur-section.png
      - docs/design/actuator/cad-femur-2s-section.png
      - docs/design/actuator/closure.png
      - docs/design/actuator/cad-femur-cutaway.png
      - docs/design/actuator/cad-femur-iso.png
      - docs/design/actuator/thermal-network.png
      - docs/design/actuator/cycloid-profiles.png
      - docs/design/actuator/operating-envelopes.png
    captions:
      docs/design/actuator/stator-F_Cu.svg: >-
        The stator board as laid out in KiCad (top copper of 12 layers, 3 oz):
        36 ten-turn spiral coils, the three phase rings at the rim, the star
        ring at the bore. DRC clean, gerbers in hw/stator. Look at: the rings
        and pads outside the magnets are what pushes the housing to Ø186.
      docs/design/actuator/rotor-field.png: >-
        Two facing Halbach rings of rectangular off-the-shelf blocks, simulated.
        30×8×5 blocks give 0.95 T at the board, 84 % of what custom trapezoids
        would. Look at: the 2.3 kN pull between the rotors that sizes the
        carriers.
      docs/design/actuator/cad-femur-section.png: >-
        Section through the single-stator femur unit from the build123d model,
        rebuilt to the review: two 8 mm cycloid discs 180° apart on twin
        journals inside the fixed pin cylinder, the motor above them, the
        crossed-roller output in the mounting face. 49.7 mm tall, Ø186, 3.9 kg.
        Look at: the empty 12 mm under the rotor is the price of the second disc.
      docs/design/actuator/cad-femur-2s-section.png: >-
        The same unit with two stators and three Halbach rotors: 62 mm tall,
        5.5 kg, twice the torque. This is configuration A in the closure
        question. Look at: the middle rotor ring carries magnets on both faces
        and is bonded onto the drum between the two boards.
      docs/design/actuator/closure.png: >-
        The loop the mass renegotiation opened. Left: each unit option at the
        robot mass it implies — the single-stator unit cannot close the
        requirement as written at any mass, two stators close it at ~130 kg.
        Right: which definition of "continuous" each configuration closes. This
        is the decision this round asks for: A (two stators, the requirement
        as written) or B (one stator, continuous = level walking).
      docs/design/actuator/cad-femur-cutaway.png: >-
        Quarter cutaway of the same model. Look at: the drum through the board
        bore joining the two rotor carriers; the disc between the pins.
      docs/design/actuator/cad-femur-iso.png: >-
        The mounting face: the output flange with its six M4 inside the Ø80
        crossed roller. The leg's pulley or link bolts here.
      docs/design/actuator/thermal-network.png: >-
        Where the stator's heat goes, from the built geometry: 0.80 K/W copper
        to housing, three quarters of it through the air films to the rotors.
        The bars are the continuous torque for each way the housing is cooled.
        Look at: the last bar — what the whole robot can sustain is set by the
        body's ability to shed ~300 W, about half the per-joint rating.
      docs/design/motor/torque-density.png: >-
        The motor study: continuous torque per kilogram and per litre for
        every candidate that fits the Ø170 × 42 mm pancake, in both packagings.
        Look at: A3 (12-layer 3 oz PCB) leads per kilogram; two-stator
        variants and the iron-core option lose.
      docs/design/actuator/operating-envelopes.png: >-
        The one motor through each joint's ratio against that joint's
        requirement. Look at: the femur is the binding joint; every joint has
        speed to spare.
      docs/design/actuator/cycloid-profiles.png: >-
        The three cycloid discs, one per unit since round 5. Look at: the
        0.6 mm eccentricity that puts 12.8 kN on the femur's needle bearing at
        peak, and 100 h of L10 life at the continuous rating.
    docs: [docs/design/07-motor-options-in-envelope.md, docs/design/08-actuator-design.md]

