# Which phases the review page shows, and what goes in each.
#
# Vision, plan, requirements and architecture are built automatically
# from the repo and need nothing here. Everything below is a design
# stage: it appears on the page only if it is listed.
#
# Regenerate the page with `review-artifact`, and check it with
# `review-artifact --check` before you publish it.
title: Hexapod
subtitle: >-
  Rounds 15-17 challenge the founding assumption. The brief -- a rugged
  multipurpose outdoor platform covering distance AND touching sensitive ground
  lightly -- puts two requirements on one machine, and they fight. The hexapod
  cannot finish a working day on any of the four missions, and at 220 kPa under
  its feet it is not even the gentle option. The resolution is not a compromise
  machine but two machines: a tracked carrier that never leaves firm ground,
  carrying a 22 kg legged scout that does the delicate work. That pair is 109 kg
  against 190, 1224 Wh a day against 4444, and 9 kPa against 220 -- and the
  scout needs a TENTH the joint torque, which is off-the-shelf. Start on the
  Platform topology tab.

phases:
  - id: platform
    title: Platform topology
    eyebrow: Stage 0 · the assumption nobody tested, the ground it works on, and the two machines that replace it
    after: vision
    images:
      - docs/design/platform/topology-energy.png
      - docs/design/platform/topology-missions.png
      - docs/design/platform/topology-matrix.png
      - docs/design/platform/hybrid-ground-impact.png
      - docs/design/platform/hybrid-tradeoff.png
      - docs/design/platform/marsupial-scale.png
      - docs/design/platform/marsupial-system.png
      - docs/design/platform/cable-drive-architectures.png
      - docs/design/platform/cable-drive-tradeoff.png
    captions:
      docs/design/platform/topology-energy.png: >-
        The founding assumption, tested. Left: cost of transport by topology.
        The hexapod figure is this project's own gait model (908 W at 1 m/s and
        124 kg, CoT 0.74); the wheeled and tracked figures are built from
        rolling resistance and driveline efficiency. Right: what the 8 kg of
        battery this design already carries actually buys on each mission.
        Look at: the hexapod does not reach a working day on any mission, and
        the tracked platform reaches one on all four.
      docs/design/platform/topology-missions.png: >-
        Left: where the energy goes on invasive-species control, a mission that
        is 70 % standing still. A legged robot pays 136 W to hold a stance —
        computed from the actuator study's own torque — and nothing on wheels
        pays anything. Right: what terrain capability costs. Look at: the last
        18 % of terrain reach costs twice the machine mass and five times the
        energy, on every mission, forever.
      docs/design/platform/topology-matrix.png: >-
        The whole trade across eight topologies. The first four columns are
        computed from the energy model; the last five are stated judgements
        written down so they can be argued with. Look at: the hexapod is worst
        or near-worst on every column except terrain reach and ground
        disturbance, and a tracked platform with flippers scores 3 or 4 on
        everything.
      docs/design/platform/hybrid-ground-impact.png: >-
        Round 16, answering the review's worry that tracks damage the ground.
        "Gentle" is three properties and they point in opposite directions.
        Left: contact pressure, what compacts soil — tracks are the best at
        5 kPa and the hexapod as designed is the WORST at 220 kPa, four times a
        person's footfall, because a third of the robot lands on three 60 mm
        feet. Middle: ground actually touched, what crushes vegetation — here
        legs win by ten times. Right: shear, what tears turf. Look at: the
        damage the review is worried about comes from skid steering, not from
        the track, and an articulated centre pivot removes it for one actuator.
      docs/design/platform/hybrid-tradeoff.png: >-
        Left: what each option costs to run. Carrying two locomotion systems —
        a tracked chassis with stowed legs — is the worst answer at 195 kg and
        1566 Wh, heavier than the hexapod, because the legs must lift the
        tracks too. Right: the real trade, gentleness against energy;
        bottom-left is the corner worth being in. Look at: a tracked carrier
        with a 22 kg legged scout sits closest to that corner, because it
        splits the two conflicting requirements between two machines instead of
        compromising on one.
      docs/design/platform/marsupial-scale.png: >-
        Round 17, the two machines drawn to the same scale in millimetres, with
        a 1.8 m person for reference. Left: the 190 kg hexapod this project has
        been designing, 0.75 m of leg and eighteen 4.4 kg actuators. Right: the
        pair that replaces it -- a tracked carrier that never leaves firm
        ground, and a 22 kg quadruped scout with 0.43 m of leg that rides on it
        and is launched to do the delicate work. Look at: the scout is small
        enough for one person to lift into a vehicle, which is where its 22 kg
        came from -- it is the assumption everything else in round 17 hangs on.
      docs/design/platform/marsupial-system.png: >-
        What the split does to the numbers. Joint torque goes as mass x leg
        length, so a scout at a seventh the mass and half the leg needs about a
        TENTH the joint torque: knee 41 N.m against the hexapod's 392. That
        needs 7:1 to 17:1 from a $50 off-the-shelf motor, against the 25:1 to
        100:1 the hexapod needed. Look at: the standing-power curve. Held on
        its motors the scout burns 78 W doing nothing, more than it uses
        walking; a ~100 g holding brake per pitch joint makes that zero and
        takes endurance from 1.9 h to 3.1 h. That brake is the single biggest
        decision on the scout.
      docs/design/platform/cable-drive-architectures.png: >-
        Round 18, answering the review's question: a joint capstan needs the
        cable anchored at both ends, so can a cable drive turn a wheel? Five
        ways, all sized on the carrier's own drive sprocket (9 N.m level,
        30 N.m on a 30 degree slope). A is what we have and it turns the wheel
        54 degrees before it stops. B splices the rope into an endless loop --
        that works, but Dyneema's very low friction on metal means the shafts
        carry 1910 N of pretension whenever the machine is switched on. Look
        at C: putting the same loop in a 36 degree wedge groove raises
        effective friction to 0.28, which cuts the shaft load to 623 N AND
        lets a 1.5 mm rope carry it instead of 2.5 mm, which lets a Ø12 pulley
        drive it, which gives 20:1 in ONE stage. Rope size and pulley size are
        one decision, not two. That is the elevator traction sheave.
      docs/design/platform/cable-drive-tradeoff.png: >-
        What it costs. Left: the rope's whole advantage is the small drive
        pulley -- 20:1 in one stage where a toothed belt stops at 6.5:1 and
        needs two shafts to get there. Middle and right: the price is that the
        rope becomes a wear item. Every element is bent 2885 times per
        kilometre driven, and published bend-over-sheave life for bare fibre
        braid would put a rope at 0.3 to 3.5 km -- 35 to 350 km even if that
        figure is a hundred times pessimistic here, against the ~2000 km of
        transit a season. Look at the third bar: the walking leg's capstan
        rope is cycled just as hard, 2500 bends per km, and ITS life was never
        computed either. That is a hole in round 8, not a new objection.
    docs: [docs/design/11-platform-topology.md, docs/design/12-hybrid-mobility.md, docs/design/13-marsupial-system.md, docs/design/14-continuous-cable-drive.md]

