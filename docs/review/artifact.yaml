# Which phases the review page shows, and what goes in each.
#
# Vision, plan, requirements and architecture are built automatically
# from the repo and need nothing here. Everything below is a design
# stage: it appears on the page only if it is listed.
#
# Regenerate the page with `review-artifact`, and check it with
# `review-artifact --check` before you publish it.
title: Hexapod
subtitle: >-
  A large-dog-sized outdoor hexapod with all eighteen motors in the body.
  Round 14: one full leg on the off-the-shelf outrunner units, in CAD, with
  loads, range of motion and a BOM. Two findings lead: the capstan rope
  drive as drawn cannot be wound (fleet angles of 5 to 53 degrees), and the
  leg weighs 16 kg against the 9 kg the cost search assumed, so the robot
  does not close at 119 kg. Round 13 added the optimised single-stator PCB
  motor and the topology, magnet-grade and iron-teeth comparison.

phases:
  - id: geometry
    title: Drawings
    eyebrow: Stage 1 · dimensioned geometry
    after: vision
    images:
      - docs/design/drawing/top.png
      - docs/design/drawing/front.png
      - docs/design/drawing/side.png
      - docs/design/drawing/hip-stack.png
    captions:
      docs/design/drawing/top.png: >-
        Body, hip stacks, batteries and all six legs at the sprawl neutral
        stance, from above. Look at: the hip spacing, the foot circle each
        leg can reach, and the ±30° yaw of the front and rear leg planes.
      docs/design/drawing/front.png: >-
        Front view of the sprawl stance with a 6 ft figure. Look at: hip,
        knee and deck heights, and the coxa / femur / tibia lengths.
      docs/design/drawing/side.png: >-
        Side views of both stances of the same robot. Look at: how much
        taller the mammal stance stands, and the stance lengths.
      docs/design/drawing/hip-stack.png: >-
        Section through one hip: three coaxial pancake actuators, the yaw
        output through the floor and the coxa. This is the volume the motor
        study has to fill.
    docs: [docs/design/06-geometry.md]

  - id: sizing
    title: Sizing
    eyebrow: Stage 1 · analysis
    after: vision
    images:
      - docs/design/sizing/leg-stance.png
      - docs/design/sizing/torque-map.png
      - docs/design/sizing/ratio-trade.png
    captions:
      docs/design/sizing/leg-stance.png: >-
        One leg in its own plane at the rider load (585 N per foot), both
        stances. The tibia is near vertical under load, so the femur joint
        carries almost everything. Look at: is 80 / 300 / 400 mm the right
        leg, and is a knee-up leg what you want?
      docs/design/sizing/torque-map.png: >-
        Femur and knee torque over the foot workspace at the rider load.
        Contours are the continuous / 10-minute / peak ratings. Look at:
        how much of the workspace the controller must fence off under a rider.
      docs/design/sizing/ratio-trade.png: >-
        What a Ø170 mm PCB axial-flux motor gives at the joint through an
        in-plane cycloid, one or two stators, against the requirement bands.
        Look at: a single stator does not close at 50:1; two do, and 2 m/s
        is out of reach either way.
    docs: [docs/design/01-sizing.md]

  - id: topology
    title: Leg topology
    eyebrow: Stage 1 · trade study
    after: sizing
    images:
      - docs/design/topology/torques.png
      - docs/design/topology/step-up.png
    captions:
      docs/design/topology/torques.png: >-
        Joint torque each topology sees over the routine working volume under
        the walking load, and at the neutral stance. Look at: which joint the
        weight levers against, and the sum, which is what the actuators weigh.
      docs/design/topology/step-up.png: >-
        What a 300 mm step costs each leg proportion: the foot has to move
        outward to clear the leg's minimum extension, and the femur pays for
        the reach. Look at: the 625 mm tibia's fold limit.
    docs: [docs/design/02-leg-topology.md, docs/design/03-architecture-levers.md, docs/design/04-motor-reduction-options.md]

  - id: bio
    title: Bio-inspiration
    eyebrow: Stage 1 · study of nature
    after: topology
    images:
      - docs/design/bio/insect-leg.png
      - docs/design/bio/grf-direction.png
    captions:
      docs/design/bio/insect-leg.png: >-
        An insect leg and ours drawn to the same scheme. The insect's three
        joints map onto our yaw, femur and knee almost one to one; what we
        lack is the tarsus. Look at: the slanted first axis, and the power
        joint being the second one in both.
      docs/design/bio/grf-direction.png: >-
        The cockroach's trick computed on our leg: pushing the foot inward as
        well as down points the ground reaction force at the femur axis and
        takes the femur torque to zero. Look at: the friction it needs.
    docs: [docs/design/05-bio-inspiration.md]

  - id: actuator
    title: Actuator
    eyebrow: Stage 2 · motor and reducer design
    after: bio
    images:
      - docs/design/motor/torque-density.png
      - docs/design/actuator/stator-F_Cu.svg
      - docs/design/actuator/rotor-field.png
      - docs/design/actuator/cad-femur-section.png
      - docs/design/actuator/cad-femur-1s-section.png
      - docs/design/actuator/motor-market.png
      - docs/design/actuator/transmission-options.png
      - docs/design/actuator/topology-compare.png
      - docs/design/actuator/cost-search.png
      - docs/design/actuator/capstan.png
      - docs/design/actuator/closure.png
      - docs/design/actuator/cad-femur-cutaway.png
      - docs/design/actuator/cad-femur-iso.png
      - docs/design/actuator/thermal-network.png
      - docs/design/actuator/cycloid-profiles.png
      - docs/design/actuator/operating-envelopes.png
      - docs/design/actuator/1s-opt-sweep.png
      - docs/design/actuator/1s-opt-envelope.png
      - docs/design/actuator/1s-opt-section.png
      - docs/design/actuator/1s-opt-F_Cu.svg
    captions:
      docs/design/actuator/1s-opt-sweep.png: >-
        Round 13: the single-stator sweep inside a Ø190 housing (Ø182 board,
        every rim radius of layout v2 moved in 0.9 mm). 10 037 candidates, each
        board laid out by the generator and rated the way the canonical board
        is: layers 6–20 at 2 oz and bonded pairs, 24/36/48 coils, turns and
        trace width, 6/8/10 mm blocks. Top left: the best of each stack that
        can still reach the femur swing speed at 48 V; the grey line is the
        same stack with that constraint dropped. Top right: torque is flat in
        turns, the no-load speed is not — the 48 V bus is the lever that
        decides. Look at: the star (20 L 2 oz, 8 turns, 10 mm blocks, 2.81 N·m)
        sits 0.5 N·m below the v2 reference line, and nothing JLCPCB can build
        crosses it while reaching 2880 rpm.
      docs/design/actuator/1s-opt-envelope.png: >-
        The chosen board's torque–speed envelope at 48 V: continuous (50 W of
        copper and eddy at 120 °C), 2 s peak, and the back-EMF limit at 3008 rpm
        no-load, with the femur/knee stance points at 80:1 and 100:1, the yaw
        stance point and the two swing speeds. Look at: the stance points sit
        above the continuous line (margin 0.66 at 80:1, 0.78 at 100:1), and the
        100:1 swing at 3600 rpm is past the voltage limit — the single stator
        cannot buy torque with ratio on this bus.
      docs/design/actuator/1s-opt-section.png: >-
        Dimensioned section of the single-stator femur unit at Ø190: two
        Halbach rings of 30×5×10 blocks on 4.5 mm carriers either side of the
        3.11 mm 20-layer board, 0.5 mm clearances, the 4 mm wall outside the
        Ø182 board, the reducer below. 4.64 kg, 49.7 mm tall. Look at: the
        height is set by the two cycloid discs, not the motor — the 33 mm band
        could be 39 mm, so a thicker board or magnet costs nothing in height;
        and the Ø190 callout against the Ø192 of the canonical unit.
      docs/design/actuator/1s-opt-F_Cu.svg: >-
        Top copper of the chosen single-stator board (hw/stator/variants/1s-opt):
        36 coils of 8 turns at 0.39 mm on a Ø182 board, coils to r 83.7, the
        phase rings and pads on the rim. Generated by make_stator.py, DRC clean
        with kicad-cli at error severity. Look at: the wider, fewer turns
        compared with the v2 board's 10 × 0.28 — the price of reaching the
        femur swing speed at 48 V — and the rim moved in by 0.9 mm.
      docs/design/actuator/stator-F_Cu.svg: >-
        The stator board, layout v2 (top copper): 36 ten-turn spiral coils
        now reaching r 84.6, the magnets' outer edge, with the phase rings and
        pads moved out to the clamp rim. DRC clean, gerbers in hw/stator. That
        one change is +14 % torque per board. Look at: the coils fill the
        annulus; the board is Ø184 and the housing Ø192.
      docs/design/actuator/rotor-field.png: >-
        Two facing Halbach rings of rectangular off-the-shelf blocks, simulated.
        30×8×5 blocks give 0.95 T at the board, 84 % of what custom trapezoids
        would. Look at: the 2.3 kN pull between the rotors that sizes the
        carriers.
      docs/design/actuator/cad-femur-section.png: >-
        The canonical unit (configuration A, chosen in the round-6 review):
        two stator boards between three Halbach rotors, two 8 mm 20-lobe
        cycloid discs 180° apart on HK2512 journals inside the fixed pin
        cylinder, the crossed-roller output in the mounting face with the
        capstan drum below it; the base is now a laser-cut floor plate, a tube
        wall, a turned bearing carrier and a steel pin cage. 58 mm tall, Ø192.
        Look at: 21 pins instead of 71, and the drum that takes the rope to the
        joint.
      docs/design/actuator/cad-femur-1s-section.png: >-
        The single-stator variant kept in the CAD as the record of
        configuration B: 50 mm, 3.9 kg. Look at: the empty 12 mm under the
        rotor is the price of the second disc.
      docs/design/actuator/motor-market.png: >-
        The market search: seven off-the-shelf motors rated the same way (what
        their copper can dissipate through an assumed heat-sink path, not the
        propeller-cooled listing current), against what one motor per unit
        needs at 100:1. Winner on price: the 8318 100KV class at ~$50; the
        Turnigy 9235-100KV is the same motor with a published resistance. Look
        at: every number is from a listing, and the heat-sunk current is the
        one bench test that decides the motor family.
      docs/design/actuator/topology-compare.png: >-
        Round 13b: three questions on the single-stator optimum, one 2-D
        field model. Top: the field of the two-rotor single-stator unit, of a
        single N-S rotor between two iron-backed stators, and of iron teeth in
        the coil centres. Bottom left: torque, mass and cost of seven
        arrangements in the same Ø190 package; the two-rotor single-stator unit
        stays the best air-core unit per kg and per dollar, the N-S single
        rotor needs laminated yokes at 250 Hz for 1.2x the torque at 1.7x the
        mass. Bottom right: magnet grade moves torque by +-5 %, N52 cannot run
        at the working temperature. Look at: the teeth box, a 20-35 % gain that
        doubles the rotor pull and leaves JLCPCB.
      docs/design/actuator/transmission-options.png: >-
        Round 12: does the off-the-shelf outrunner still need the cycloid?
        Left, what the femur gets from one 8318 through each transmission
        against what it needs at that option's robot mass: only the cycloid
        (or an OTS planetary) closes. Right, why: a rope drive must wrap
        (ratio x joint travel) turns on the motor drum, so a capstan tops out
        near 10:1 whatever the motor. Look at: direct-to-capstan supports a
        4 kg robot; the cycloid stays.
      docs/design/actuator/cost-search.png: >-
        The cost search: each option at the robot mass its own weight implies,
        filled markers close the requirement as written. One OTS 8318
        outrunner through a 25-lobe cycloid and the 4:1 capstan closes at a
        77 kg robot for ~$420 at 20 units; the PCB two-stator unit is $597 at
        124 kg; a single PCB stator does not close. Look at: the outrunner
        continuous rating is an assumption until measured.
      docs/design/actuator/capstan.png: >-
        The second stage: a Ø60 drum on the unit's output, a Ø210 sector at the
        femur / knee pivot, one pre-tensioned 5 mm Dyneema rope, 3.5:1. The
        cycloid drops from 71 pins to 21 and sees 3.5× less torque. Look at:
        rope tension against the datasheet break load (SF 4 at the knee peak),
        and that the drum sits on the yaw axis so yaw winds the drum (a
        software-compensated coupling).
      docs/design/actuator/closure.png: >-
        The loop the mass renegotiation opened. Left: each unit option at the
        robot mass it implies — the single-stator unit cannot close the
        requirement as written at any mass, two stators close it at ~130 kg.
        Right: which definition of "continuous" each configuration closes. The
        review chose A; look at: the margins A carries at 128 kg.
      docs/design/actuator/cad-femur-cutaway.png: >-
        Quarter cutaway of the same model. Look at: the drum through the board
        bore joining the two rotor carriers; the disc between the pins.
      docs/design/actuator/cad-femur-iso.png: >-
        The mounting face: the output flange with its six M4 inside the Ø80
        crossed roller. The leg's pulley or link bolts here.
      docs/design/actuator/thermal-network.png: >-
        Where the stator's heat goes, from the built geometry: 0.80 K/W copper
        to housing, three quarters of it through the air films to the rotors.
        The bars are the continuous torque for each way the housing is cooled.
        Look at: the last bar — what the whole robot can sustain is set by the
        body's ability to shed ~300 W, about half the per-joint rating.
      docs/design/motor/torque-density.png: >-
        The motor study: continuous torque per kilogram and per litre for
        every candidate that fits the Ø170 × 42 mm pancake, in both packagings.
        Look at: A3 (12-layer 3 oz PCB) leads per kilogram; two-stator
        variants and the iron-core option lose.
      docs/design/actuator/operating-envelopes.png: >-
        The one motor through each joint's ratio against that joint's
        requirement. Look at: the femur is the binding joint; every joint has
        speed to spare.
      docs/design/actuator/cycloid-profiles.png: >-
        The three cycloid discs, one per unit since round 5. Look at: the
        0.6 mm eccentricity that puts 12.8 kN on the femur's needle bearing at
        peak, and 100 h of L10 life at the continuous rating.
    docs: [docs/design/07-motor-options-in-envelope.md, docs/design/08-actuator-design.md]

