name: Fill scans (Modal GPU, NVIDIA Fixer)

# Runs tools/captures/teacher_fill.py (Teacher B) on Modal with NVIDIA Fixer as the filler,
# beside the CPU stand-in (Telea) for comparison: the drop test (scored against what was
# there) and the fill from outside (an inferred layer). Uploads the reports, strips and
# inferred tilesets as an artifact. Nothing is published. See infra/modal/fill.py and
# docs/WORLD_MODEL_RUNBOOK.md.
#
# A `fill:<scan>` job fills only the cells a re-scan left weak (ADR 0016, Fill): give each
# its scan's epoch's fill targets as `fill_targets_url` (`<scan>=<URL>` pairs, the URL
# `$TWIN_API_URL/api/v1/sites/<site>/fill-targets?epochId=<epoch>`). They are fetched here,
# one file per scan, and forwarded to its job; a fill job without them fails here, before
# Modal starts anything. drop and split jobs are not gated (neither is published).
#
# A push to a `wm-*` working branch that touches the fill code (not `living-models`, so
# merges there start no GPU run) has no inputs, so it runs no job and says so; the work is
# dispatched with `jobs` (workflow_dispatch only works once this file is on the default
# branch). The Modal token
# is the repository's; Fixer needs no other secret.

on:
  push:
    branches: ["wm-*"]
    paths:
      - infra/modal/fill.py
      - tools/captures/teacher_fill.py
      - tools/captures/rescan_gate.py
      - tools/captures/split_objects.py
      - tools/captures/splat_render.py
      - tools/captures/tests/test_gsplat_parity.py
      - tools/captures/world_model_client.py
      - tools/captures/inpaint_models.py
      - tools/captures/distill_fill.py
      - .github/workflows/fill.yml
  workflow_dispatch:
    inputs:
      jobs:
        description: kind:scan pairs (drop|fill|split, scans in infra/modal/fill.py)
        type: string
        default: drop:yard,drop:spool
      fillers:
        description: Fillers (short names in infra/modal/fill.py FILLERS)
        type: string
        default: telea,fixer
      distill:
        description: Distill steps for fill jobs (0 = none)
        type: string
        default: "0"
      renderer:
        description: Render the views on the CPU or with gsplat on a GPU (cpu, gsplat)
        type: string
        default: gsplat
      fill_targets_url:
        description: "Fill jobs' targets: <scan>=<API fill-targets URL> pairs, comma-separated (one bare URL for one fill job)"
        type: string
        default: ""

concurrency:
  group: fill-${{ github.ref }}
  cancel-in-progress: false

env:
  # No default: a push (no inputs) runs nothing and says so -- its old default, fill:camp,
  # can no longer pass the fill gate (the camp has no measured epoch).
  JOBS: ${{ inputs.jobs || '' }}
  # Scans to run fill.py probe on (Fixer on renders prepared several ways); empty: none.
  PROBES: ""
  FILLERS: ${{ inputs.fillers || 'qwen-chain,lama-chain' }}
  DISTILL: ${{ inputs.distill || '1500' }}
  RENDERER: ${{ inputs.renderer || 'gsplat' }}
  # Non-empty: also run tests/test_gsplat_parity.py (CPU against gsplat) on a GPU.
  PARITY: ""
  # Fill jobs: condition without gaussians larger than this (m; 0 = keep all). The camp's
  # edge floaters (scale 0.5-2.7 m) cover most of a gsplat view from outside.
  MAX_SCALE: "0.5"
  # `<scan>=<URL>` pairs: each fill job's GET /api/v1/sites/{id}/fill-targets?epochId=.
  FILL_TARGETS_URL: ${{ inputs.fill_targets_url || '' }}
  TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}

jobs:
  fill:
    name: Fill on a Modal GPU
    # A push whose message carries [skip-fill] (one that only shares a file with the fill
    # code, such as world_model_client.py) starts no fill run.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-fill]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Nothing to run without jobs
        if: env.JOBS == ''
        run: |
          echo "::notice::No jobs: a push runs nothing. Dispatch this workflow with jobs (drop:yard, fill:<scan> with fill_targets_url, ...) to run on Modal."
      - uses: actions/checkout@v4
        if: env.JOBS != ''
      - uses: astral-sh/setup-uv@v6
        if: env.JOBS != ''
      - name: Check the Modal token is there
        if: env.JOBS != ''
        run: |
          test -n "$MODAL_TOKEN_ID" -a -n "$MODAL_TOKEN_SECRET" \
            || { echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set"; exit 1; }
      - name: Fetch each fill job's fill targets
        if: env.JOBS != ''
        # Read as data, validated here, never interpolated into a shell line. Only the API's
        # own fill-targets route is fetched; a 409 (nothing re-scanned, not measured) fails.
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          from pathlib import Path

          api = os.environ["TWIN_API_URL"].rstrip("/")
          route = re.compile(re.escape(api) + r"/api/v1/sites/[0-9a-f-]{36}/fill-targets"
                             r"(\?epochId=[0-9a-f-]{36})?")
          jobs = [j.strip() for j in os.environ["JOBS"].split(",") if j.strip()]
          fills = sorted({j.partition(":")[2] for j in jobs if j.startswith("fill:")})
          given = {}
          for part in (p.strip() for p in os.environ["FILL_TARGETS_URL"].split(",") if p.strip()):
              scan, sep, url = part.partition("=")
              if not sep or "://" in scan:
                  if len(fills) != 1:
                      raise SystemExit("::error::a bare fill_targets_url needs exactly one fill job; "
                                       "name each: <scan>=<URL>")
                  scan, url = fills[0], part
              if not re.fullmatch(r"[a-z0-9-]+", scan) or not route.fullmatch(url):
                  raise SystemExit(f"::error::fill_targets_url {part!r}: <scan>=<URL>, the URL "
                                   f"{api}/api/v1/sites/<site>/fill-targets[?epochId=<epoch>]")
              given[scan] = url
          missing = [s for s in fills if s not in given]
          if missing:
              raise SystemExit(f"::error::fill:{', fill:'.join(missing)} has no fill targets: a "
                               "fill runs only where a re-scan left cells weak (fill_targets_url)")
          out = Path("fill-targets")
          out.mkdir(exist_ok=True)
          pairs = []
          for scan in fills:
              request = urllib.request.Request(
                  given[scan],
                  headers={"Accept": "application/json", "User-Agent": "hexapod-fill-targets/1"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"::error::{given[scan]}: {error.code} "
                                   f"{error.read().decode(errors='replace')[:500]}")
              json.loads(body)
              (out / f"{scan}.json").write_bytes(body)
              pairs.append(f"{scan}=fill-targets/{scan}.json")
              print(f"{scan}: {len(body)} bytes of fill targets from {given[scan]}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"STILL_WEAK={','.join(pairs)}\n")
          PY
      - name: Modal secrets present (names only)
        if: env.JOBS != ''
        continue-on-error: true
        run: uv run --with modal==1.5.5 modal secret list
      - name: modal run infra/modal/fill.py
        if: env.JOBS != ''
        run: |
          # The Hugging Face secret by its prefix (the workspace's is not named `huggingface`).
          HEXAPOD_HF_SECRET=$(uv run --with modal==1.5.5 modal secret list --json | python3 -c '
          import json, sys
          def names(x):
              if isinstance(x, dict):
                  for v in x.values(): yield from names(v)
              elif isinstance(x, list):
                  for v in x: yield from names(v)
              elif isinstance(x, str) and x.startswith("huggingface"):
                  yield x
          print(next(names(json.load(sys.stdin)), "huggingface"))') || HEXAPOD_HF_SECRET=huggingface
          export HEXAPOD_HF_SECRET
          echo "Hugging Face secret: $HEXAPOD_HF_SECRET"
          uv run --with modal==1.5.5 modal run infra/modal/fill.py \
            --jobs "$JOBS" --fillers "$FILLERS" --distill "$DISTILL" --out fill-out \
            --probes "$PROBES" --renderer "$RENDERER" ${PARITY:+--parity-test} \
            --max-scale-m "$MAX_SCALE" --still-weak "${STILL_WEAK:-}"
      - uses: actions/upload-artifact@v4
        if: always() && env.JOBS != ''
        with:
          name: fill
          path: fill-out
          if-no-files-found: warn
