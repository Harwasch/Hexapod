name: Deploy

# `workflow_dispatch` only, and deliberately. This workflow needs four secrets that do
# not exist in this repository yet (nobody has created the accounts -- see
# docs/DEPLOYMENT.md § Handover), so a `push` trigger would paint every commit on main
# red for want of a credential and teach everyone to ignore the badge. ci.yml already
# uses `workflow_dispatch` for the same reason in reverse: it is how a check gets run on
# demand. Here it is how a deploy stays opt-in until there is somewhere to deploy to.
#
# Each job checks its own secrets in its first step and fails with the name of the one
# that is missing, rather than failing forty lines later inside a CLI's auth error.
#
# It also assumes the infrastructure already exists -- the Fly app, the worker's volume,
# the bucket, the Pages project, the database. `.github/workflows/provision.yml` is the
# step before this one; it creates those and then calls this workflow.
#
# NEVER RUN. No deployment has ever been made from this workflow, from this repository or
# from anywhere else. The commands in it are the same ones docs/DEPLOYMENT.md tells you
# to run by hand, which is the only sense in which they have been checked.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - everything
          - api
          - web
          - preflight
        default: everything
      enable_land:
        description: Enable Land in the web build and back up/rehearse the database before an API release
        type: boolean
        default: false
      api_base_url:
        description: The API's public origin (blank = VITE_API_BASE_URL, else the Fly app in fly.toml)
        type: string
        default: ""
      offline_catalog_url:
        description: catalog.json's public URL (blank = VITE_OFFLINE_CATALOG_URL)
        type: string
        default: ""
      public_bucket_url:
        description: The public bucket's URL, whose r2.dev host /r2/ proxies (blank = R2_PUBLIC_URL, else the catalog's host)
        type: string
        default: ""
  # provision.yml calls this workflow rather than repeating its steps: there is one
  # deploy, described in one place, whoever starts it. `workflow_call` cannot take a
  # `choice`, so `target` is a string here and the two `if:` comparisons below accept
  # exactly the same three words either way.
  #
  # The two URL inputs exist because provisioning *computes* values that a standalone
  # dispatch has to be told: the Fly app's origin and the bucket's public catalog URL.
  # Both fall back to the repository variables. A provisioned deployment has neither
  # variable set -- provision passes the values in -- and a plain dispatch of this
  # workflow therefore once built the web app with no API origin at all: every request
  # went to Pages itself and was answered 405, and the console said the API was offline.
  # So the API origin now also falls back to the Fly app `fly.toml` names, and a build
  # that still has none fails instead of shipping. See docs/DEPLOYMENT.md § Handover.
  workflow_call:
    inputs:
      target:
        description: What to deploy
        type: string
        default: everything
      enable_land:
        description: Enable Land and require the private database backup/migration rehearsal
        type: boolean
        default: false
      api_base_url:
        description: The API's public origin, overriding the VITE_API_BASE_URL variable
        type: string
        default: ""
      offline_catalog_url:
        description: catalog.json's public URL, overriding VITE_OFFLINE_CATALOG_URL
        type: string
        default: ""
      public_bucket_url:
        description: The public bucket's URL, overriding R2_PUBLIC_URL for the tile proxy's host
        type: string
        default: ""

concurrency:
  # One deploy at a time. Not `cancel-in-progress`: a half-applied `fly deploy` is worse
  # than a queued one, and the release command runs migrations.
  # Every branch targets the same production app and Pages project.
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    name: API and worker · Fly.io
    if: inputs.target == 'everything' || inputs.target == 'api' || inputs.target == 'preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The secret this job needs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is not set. Create a deploy token with"
            echo "::error::'fly tokens create deploy -a twin-api' and add it as a"
            echo "::error::repository secret. See docs/DEPLOYMENT.md."
            exit 1
          fi
      # flyctl's own installer rather than a third-party action. `fly deploy` is one
      # command; an action would add a repository whose tag we would be guessing at, and
      # Fly's published instructions pin nothing either.
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
      - name: Install backup and migration rehearsal tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          uv sync --frozen --project apps/api
      - name: Private database backup and restore/migration rehearsal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_NAME: ${{ vars.NEON_PROJECT_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
        run: apps/api/.venv/bin/python scripts/prepare-worlds-land-release.py
      - name: Ensure the single API ledger volume exists
        if: inputs.target != 'preflight'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml | head -1)
          region=$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' fly.toml | head -1)
          count=$(flyctl volumes list --app "$app" --json | jq '[.[] | select(.name == "twin_worlds_data")] | length')
          if [ "$count" = 0 ]; then
            flyctl volumes create twin_worlds_data --app "$app" --region "$region" --size 1 --yes
          elif [ "$count" != 1 ]; then
            echo "::error::Multiple Worlds volumes found; refusing independent API ledgers."
            exit 1
          fi
      - name: Consolidate the verified shared-database API before attaching the ledger
        if: inputs.target != 'preflight'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl scale count app=1 --yes
      # `--remote-only` builds on Fly's builder, so the 500 MB+ image is never pulled
      # through the runner. The build context is the repository root because that is
      # where fly.toml is: infra/api.Dockerfile copies tools/pipeline and tools/captures
      # as well as apps/api, and a context of apps/api would fail on the first COPY.
      #
      # fly.toml's release_command runs `alembic upgrade head` in its own machine before
      # any machine is replaced. A migration that fails aborts the deploy with the old
      # version still serving.
      - name: fly deploy
        if: inputs.target != 'preflight'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --wait-timeout 10m
      - name: Verify API ledger ownership and single-replica placement
        if: inputs.target != 'preflight'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machines=$(flyctl machines list --json)
          count=$(printf '%s' "$machines" | jq '[.[] | select(.config.metadata.fly_process_group == "app")] | length')
          [ "$count" = 1 ] || { echo "::error::Expected exactly one API ledger owner"; exit 1; }
          machine=$(printf '%s' "$machines" | jq -r '.[] | select(.config.metadata.fly_process_group == "app") | .id')
          volume=$(flyctl volumes list --json | jq -r '.[] | select(.name == "twin_worlds_data") | .id')
          mounted=$(printf '%s' "$machines" | jq -r '.[] | select(.config.metadata.fly_process_group == "app") | .config.mounts[]? | select(.path == "/worlds-data") | .volume')
          [ -n "$volume" ] && [ "$mounted" = "$volume" ] || { echo "::error::Worlds ledger is not on its expected persistent volume"; exit 1; }
          flyctl ssh console --machine "$machine" --user root --command "chown 1000:1000 /worlds-data"
          flyctl ssh console --machine "$machine" --user root --command "chmod 700 /worlds-data"
          flyctl ssh console --machine "$machine" --user api --command "/app/.venv/bin/python -c 'from pathlib import Path; p=Path(\"/worlds-data/.release-write-check\"); p.write_text(\"ok\"); p.unlink()'"
      # `fly deploy` restores every machine to the state it found it in, so a worker that
      # was stopped before the deploy is stopped after it -- and flyctl reports that as "a
      # good state". The app process is behind Fly's proxy, which starts it on the next
      # request; the worker has no service, so nothing ever would. Found on the first
      # deployment, where a trial account's five-minute limit stopped the worker and every
      # later deploy left it stopped while verify passed.
      #
      # Starting it here makes a deploy mean "the worker is running on this version",
      # whatever stopped it: a trial limit, a host migration, a crash that exhausted its
      # restarts. If the process then dies on start, verify's worker check is what says so.
      - name: The background workers are started, not just updated
        if: inputs.target != 'preflight'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          stopped="$(flyctl machines list --json | jq -r \
            '.[] | select((.config.metadata.fly_process_group == "worker" or .config.metadata.fly_process_group == "research") and .state != "started") | .id')"
          if [ -z "$stopped" ]; then
            echo "every worker machine is already running."
            exit 0
          fi
          for id in $stopped; do
            echo "starting worker machine $id"
            flyctl machines start "$id"
          done
      # The same repository variable the web build bakes into the bundle, so there is
      # one name for one thing. Unset, this step says so and passes: a deploy should not
      # be reported as failed because nobody has written down where it went.
      - name: The deployed API answers
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "Neither an api_base_url input nor a VITE_API_BASE_URL variable; skipping."
            exit 0
          fi
          curl -fsS --retry 5 --retry-all-errors "${API_BASE_URL}/api/v1/health"

      - name: Land and Worlds API smoke checks (no generation or writes)
        if: inputs.enable_land && inputs.target != 'preflight'
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
          API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
        run: |
          python3 - <<'PYSMOKE'
          import json
          import os
          import time
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          app = tomllib.load(open("fly.toml", "rb"))["app"]
          base = (os.environ.get("API_BASE_URL") or f"https://{app}.fly.dev").rstrip("/")
          token = os.environ["API_WRITE_TOKEN"]
          assert token, "API_WRITE_TOKEN is required for authenticated smoke checks"
          for path in ("/api/v1/health", "/api/v1/land", "/api/v1/worlds/catalog", "/api/v1/worlds/workers", "/api/v1/worlds/readiness"):
              for attempt in range(6):
                  try:
                      with urlopen(Request(base + path, headers={"Authorization": "Bearer " + token}), timeout=30) as response:
                          data = json.load(response)
                      if path.endswith("/health"):
                          assert data["database"] is True
                      if path.endswith("/readiness"):
                          assert data["provisioningEnabled"] is False, "Paid provisioning must remain disabled"
                      print(path, "OK")
                      break
                  except Exception:
                      if attempt == 5:
                          raise SystemExit(f"Smoke check failed for {path}; response body withheld")
                      time.sleep(3)
          try:
              urlopen(base + "/api/v1/worlds/workers", timeout=30)
          except HTTPError as error:
              assert error.code == 401, "Expected authentication requirement"
          else:
              raise SystemExit("Worlds private reads unexpectedly allowed without authentication")
          print("Worlds private reads require authentication")
          PYSMOKE

  web:
    name: Web · Cloudflare Pages
    needs: api
    if: always() && !cancelled() && (inputs.target == 'web' || (inputs.target == 'everything' && needs.api.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The secrets this job needs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            missing="${missing} CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::missing repository secret(s):${missing}."
            echo "::error::See docs/DEPLOYMENT.md for the token's required permissions."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every VITE_ value is baked into the bundle at build time and is public once it
      # ships. The ion token is a secret only in the sense that it is yours: scope it to
      # assets:read + geocode and set its Allowed URLs to this origin, because nothing
      # here can stop a reader of the bundle from using it otherwise.
      - name: Build
        env:
          VITE_CESIUM_ION_ACCESS_TOKEN: ${{ secrets.VITE_CESIUM_ION_ACCESS_TOKEN }}
          GIVEN_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
          VITE_OFFLINE_CATALOG_URL: ${{ inputs.offline_catalog_url || vars.VITE_OFFLINE_CATALOG_URL }}
          VITE_ENABLE_PHOTOREALISTIC: ${{ vars.VITE_ENABLE_PHOTOREALISTIC }}
          VITE_ENABLE_LAND_EXPLORATION: ${{ inputs.enable_land }}
        run: |
          api="${GIVEN_API_BASE_URL%/}"
          if [ -z "$api" ]; then
            app=$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml | head -1)
            [ -n "$app" ] && api="https://${app}.fly.dev"
            echo "no API origin given; using the Fly app in fly.toml: $api"
          fi
          if [ -z "$api" ]; then
            echo "::error::no API origin: pass api_base_url, set VITE_API_BASE_URL, or name the app in fly.toml."
            echo "::error::A web build without one sends every API call to Pages and gets 405s."
            exit 1
          fi
          if [ -z "${VITE_OFFLINE_CATALOG_URL}" ]; then
            echo "::warning::no offline catalog URL: the console has no fallback catalogue when the API is down."
          fi
          VITE_API_BASE_URL="$api" pnpm --filter @twin/web build
          # The origin is inlined into the bundle; not finding it there is the bug above.
          grep -rqF "$api" apps/web/dist/assets || { echo "::error::$api is not in the built bundle"; exit 1; }
      # Pages reads _headers from the root of the deployed directory, and Vite copies
      # only apps/web/public into dist. Keeping the file in infra/ instead means a local
      # build and the e2e suite see exactly the bundle they saw before this workflow
      # existed; the cost is this one line, which wrangler.toml also documents.
      - name: Add the Pages headers
        run: cp infra/pages/_headers apps/web/dist/_headers
      # functions/r2/ fetches from exactly one host, named by TILE_PROXY_HOST in
      # wrangler.toml's [vars] -- committed empty, because the hostname belongs to the
      # account and not to the repository. It is written in here, from the public
      # bucket's URL: provision.yml passes the one it computed; a dispatch falls back to
      # the R2_PUBLIC_URL variable and then to the offline catalog's host, which lives in
      # the same bucket. Only an r2.dev hostname is written. A custom domain, or nothing at
      # all, leaves the variable empty, the function answers its probe without
      # `X-Tile-Proxy`, and the web app loads tiles from the bucket's own URL -- which is
      # what it should do for a custom domain, and the safe fallback for nothing.
      - name: Pin the tile proxy to the public bucket
        env:
          PUBLIC_BUCKET_URL: ${{ inputs.public_bucket_url || vars.R2_PUBLIC_URL }}
          CATALOG_URL: ${{ inputs.offline_catalog_url || vars.VITE_OFFLINE_CATALOG_URL }}
        run: |
          set -euo pipefail
          source="${PUBLIC_BUCKET_URL:-$CATALOG_URL}"
          host="$(printf '%s' "$source" | sed -E 's|^[a-zA-Z]+://||; s|[/?#].*$||' | tr 'A-Z' 'a-z')"
          if ! printf '%s' "$host" | grep -Eq '^pub-[0-9a-f]{32}\.r2\.dev$'; then
            echo "::notice::no r2.dev public bucket URL (got '${host}'): /r2/ stays off and the web app loads tiles directly."
            exit 0
          fi
          sed -i -E "s|^TILE_PROXY_HOST = .*$|TILE_PROXY_HOST = \"${host}\"|" wrangler.toml
          grep -qxF "TILE_PROXY_HOST = \"${host}\"" wrangler.toml \
            || { echo "::error::could not write TILE_PROXY_HOST into wrangler.toml"; exit 1; }
          echo "the tile proxy serves https://${host} and nothing else."
      # wrangler from npm rather than a third-party action, for the reason flyctl is
      # installed by hand above. `--branch main` marks this a production deployment;
      # without it wrangler infers a preview from the current branch name.
      - name: wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages deploy --branch main
