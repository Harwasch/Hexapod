name: Living plants

# Living Mode for every plant of an uploaded capture (docs/CAPTURES.md, "Every plant in a
# capture"; ADR 0008, the multi-plant addendum). Opt-in, and never run by default.
#
# * **What it does.** `plants`: fetches the capture's canonical.ply (the API's
#   /captures/{id}/splat.ply redirect) and the level-of-detail tiles its run published,
#   runs the scene step (tools/captures/scene_plants.py) -- ground, classes, plant
#   instances, one forest rig, its motion sidecar, the per-tile plant binding -- and keeps
#   all of it as an artifact to review, with the classes and plants in the job summary, and
#   the request that attaches the rig (`attach.json`: the splat asset, `basedOn` the tileset
#   whose tiles it bound, `rigUrl: rig.json`). `publish` (only when asked): stages rig.json,
#   motion.json and plants.json in the private bucket and asks the API to attach them
#   (tools/captures/attach_sidecars.py), which cuts a new generation and points the asset's
#   renderConfig.rigUrl at rig.json in the same transaction as its new URL -- no separate
#   PATCH of the render config, which raced every other writer of it. Nothing here writes
#   the public bucket or a tileset.json (docs/DEPLOYMENT.md, "Sidecars: one publisher").
# * **Identity is checked, not assumed.** The scene step replays the packer's plan over the
#   PLY and refuses unless every published tile holds exactly the gaussians that plan puts in
#   it; the rig is stamped with the published tiles' own checksums; and the viewer refuses a
#   tile whose checksum the binding does not list.
# * **How to run it.** `workflow_dispatch` once this file is on the default branch; before
#   that, push a commit whose message carries `[plants|capture=<uuid>]`, adding `|publish`
#   to publish and `|assume_metric` for a capture whose scale source is unresolved but whose
#   splat is known to be in metres (a phone app with ARKit, say).
#
# Variables: TWIN_API_URL. For `publish` only, secrets CLOUDFLARE_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, API_WRITE_TOKEN and the variable R2_BUCKET (the
# private bucket).

on:
  push:
    branches: [living-models]
  workflow_dispatch:
    inputs:
      capture:
        description: "The capture's id (a UUID)"
        type: string
        required: true
      publish:
        description: "Attach the rig beside the tiles, through the API, and point the asset at it"
        type: boolean
        default: false
      assume_metric:
        description: "The splat is in metres even though its scale source is unresolved"
        type: boolean
        default: false

jobs:
  plan:
    name: What to run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[plants')
    runs-on: ubuntu-latest
    outputs:
      capture: ${{ steps.plan.outputs.capture }}
      publish: ${{ steps.plan.outputs.publish }}
      assume_metric: ${{ steps.plan.outputs.assume_metric }}
    steps:
      # Read as data, validated here, never interpolated into a shell line.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          CAPTURE: ${{ inputs.capture }}
          PUBLISH: ${{ inputs.publish }}
          ASSUME_METRIC: ${{ inputs.assume_metric }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"capture": "", "publish": "false", "assume_metric": "false"}
          if os.environ["EVENT"] == "workflow_dispatch":
              for name in options:
                  options[name] = os.environ.get(name.upper(), "") or options[name]
          else:
              found = re.search(r"\[plants([^\]]*)\]", os.environ.get("MESSAGE", ""))
              for part in (found.group(1) if found else "").split("|")[1:]:
                  name, _, value = part.partition("=")
                  if name not in options:
                      raise SystemExit(f"unknown option {name!r} in the [plants] token")
                  options[name] = value if value else "true"
          uuid = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          valid = {"capture": uuid, "publish": r"true|false", "assume_metric": r"true|false"}
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"

  plants:
    name: Scene step on the capture
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAPTURE: ${{ needs.plan.outputs.capture }}
      ASSUME_METRIC: ${{ needs.plan.outputs.assume_metric }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: The capture's splat and its published tiles
        working-directory: tools/captures
        run: |
          uv sync --frozen
          extra=""
          if [ "$ASSUME_METRIC" = "true" ]; then extra="--assume-metric"; fi
          uv run python fetch_capture.py "$CAPTURE" "$RUNNER_TEMP/work" --api "$TWIN_API_URL" $extra
      - name: Ground, classes, plants, one forest rig, its binding
        working-directory: tools/captures
        run: |
          mkdir -p "$RUNNER_TEMP/work/living"
          uv run python scene_plants.py "$RUNNER_TEMP/work/canonical.ply" \
            --tiles "$RUNNER_TEMP/work/tiles" --out "$RUNNER_TEMP/work/living" \
            | tee "$RUNNER_TEMP/work/living/summary.json"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          scene = json.load(open(os.environ["RUNNER_TEMP"] + "/work/living/scene.json"))
          print("## Scene step\n")
          print(f"Analysed {scene['analysedSplats']:,} of {scene['keptSplats']:,} kept splats "
                f"({scene['analysis']['rule']}).\n")
          if "timingsS" in scene:
              print("Seconds: " + ", ".join(f"{k} {v:g}" for k, v in scene["timingsS"].items()) + "\n")
          print("| class | splats |\n| --- | ---: |")
          for name, count in scene["classCounts"].items():
              print(f"| {name} | {count:,} |")
          print("\n| plant | rig | height m | splats analysed | splats bound | joints |")
          print("| --- | --- | ---: | ---: | ---: | ---: |")
          for p in scene["plants"]:
              print(f"| {p['id']} | {p['rig']} | {p['heightM']} | {p['splats']:,} "
                    f"| {p['boundSplats']:,} | {p['nodes']} |")
          print(f"\nRig: {scene['rig']['nodes']} joints over {scene['rig']['tiles']} tiles.")
          PY
      - name: The request that attaches the rig
        working-directory: tools/captures
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, shutil
          from pathlib import Path

          import attach_sidecars

          work = Path(os.environ["RUNNER_TEMP"]) / "work"
          asset = json.loads((work / "capture.json").read_text())["asset"]
          attach = work / "attach"
          attach.mkdir()
          for name in ("rig.json", "motion.json", "plants.json"):
              shutil.copy(work / "living" / name, attach / name)
          attach_sidecars.write_manifest(
              attach, asset_id=asset["id"], based_on=asset["source"]["url"], rig_url="rig.json"
          )
          print(f"\nTo attach to asset `{asset['id']}` at {asset['source']['url']}.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: living-plants
          path: |
            ${{ runner.temp }}/work/living/
            ${{ runner.temp }}/work/attach/
            ${{ runner.temp }}/work/capture.json
          if-no-files-found: error

  publish:
    name: Attach the rig beside the tiles, through the API
    needs: [plan, plants]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish per capture at a time; the API serializes attaches to one asset anyway.
    concurrency:
      group: living-plants-${{ needs.plan.outputs.capture }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OBJECT_STORAGE_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      OBJECT_STORAGE_BUCKET: ${{ vars.R2_BUCKET || 'twin-assets' }}
      API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
    steps:
      - name: The secrets this job needs
        run: |
          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY API_WRITE_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: living-plants
          path: ${{ runner.temp }}/living
      - name: Stage rig.json, motion.json and plants.json, and attach them with rigUrl
        run: uv run --no-project --with boto3 python tools/captures/attach_sidecars.py attach "$RUNNER_TEMP/living/attach"
