name: Segment by concepts (Modal GPU, bake-off C)

# Runs tools/captures/concept_scene.py (concept-first segmentation: a VLM's vocabulary, the
# named concepts found in every view, ground cover classes; docs/SCENE_OBJECTS.md §3) on a
# Modal GPU for the scans in infra/modal/segment_concepts.py, and uploads each scan's
# instances.json, instances.emb, vocabulary.json, summary and overview renders as the
# `segmentation` artifact -- the one publish-instances.yml reads. Nothing is published.
#
# Only on a push to a `seg-concept-*` branch whose head commit asks for it, so no push runs
# a GPU by accident: `[concepts|names=spool,pumpkin|segmenter=standin|budget=3]` (every
# option may be left out; those are the defaults). The Modal app refuses to start when its
# worst case is over the budget, and a `sam3` run stops before any GPU when the Hugging Face
# secret's account has no access to SAM 3's gated weights.

on:
  push:
    branches: ["seg-concept-*"]

concurrency:
  group: segment-concepts
  cancel-in-progress: false

jobs:
  segment:
    name: Segment by concepts on a Modal GPU
    if: contains(github.event.head_commit.message, '[concepts')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the Modal token is there
        run: |
          test -n "$MODAL_TOKEN_ID" -a -n "$MODAL_TOKEN_SECRET" \
            || { echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set"; exit 1; }
      # The commit's options are read as data, validated here, never interpolated into a
      # shell line (as publish-instances.yml's plan reads its own).
      - id: plan
        name: What to run
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"names": "spool,pumpkin", "segmenter": "standin", "budget": "3"}
          found = re.search(r"\[concepts([^\]]*)\]", os.environ.get("MESSAGE", ""))
          for part in (found.group(1) if found else "").split("|")[1:]:
              name, _, value = part.partition("=")
              if name not in options:
                  raise SystemExit(f"unknown option {name!r} in the [concepts] token")
              options[name] = value
          valid = {
              "names": r"(spool|pumpkin)(,(spool|pumpkin))*",
              "segmenter": r"standin|sam3",
              "budget": r"[0-9]+(\.[0-9]+)?",
          }
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          if float(options["budget"]) > 3.0:
              raise SystemExit("the owner's cap for this candidate is $3")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: modal run infra/modal/segment_concepts.py
        env:
          NAMES: ${{ steps.plan.outputs.names }}
          SEGMENTER: ${{ steps.plan.outputs.segmenter }}
          BUDGET: ${{ steps.plan.outputs.budget }}
        run: |
          # The Hugging Face secret by its prefix (the workspace's is not named `huggingface`).
          HEXAPOD_HF_SECRET=$(uv run --with modal==1.5.5 modal secret list --json | python3 -c '
          import json, sys
          def names(x):
              if isinstance(x, dict):
                  for v in x.values(): yield from names(v)
              elif isinstance(x, list):
                  for v in x: yield from names(v)
              elif isinstance(x, str) and x.startswith("huggingface"):
                  yield x
          print(next(names(json.load(sys.stdin)), "huggingface"))') || HEXAPOD_HF_SECRET=huggingface
          export HEXAPOD_HF_SECRET
          echo "Hugging Face secret: $HEXAPOD_HF_SECRET"
          uv run --with modal==1.5.5 modal run infra/modal/segment_concepts.py \
            --names "$NAMES" --segmenter "$SEGMENTER" --budget "$BUDGET" --out segment-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segmentation
          path: segment-out
          if-no-files-found: warn
