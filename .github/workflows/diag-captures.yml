# Temporary: does a single-threaded OpenBLAS stop the captures suite's SIGSEGV on Zen 4?
name: Diag captures crash
on:
  push:
    branches: [diag-captures-crash]
jobs:
  captures:
    name: Captures, one BLAS thread (${{ matrix.n }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: tools/captures
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: lscpu | grep "Model name"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run pytest -q
      - name: Committed fixture is up to date
        run: git diff --exit-code -- ../../data/tiles/synthetic-tree
