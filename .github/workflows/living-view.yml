name: Living view bake-off (Modal GPUs)

# The living-view bake-off (infra/modal/living_view.py): slight wind on the plants of a still
# render of the scan, from a video model anchored on that render -- LTX-2.5 with the
# Cinemagraph LoRA, Causal Forcing, Wan 2.1 FLF2V and Wan 2.2 TI2V-5B -- on the Minnetonka tree
# and the camp's shrubs. Nothing is published: the starts, the clips and summary.json (each
# call's wall time and estimated dollars) are the `living-view` artifact; the motion-only
# clips and the comparison page are made from it afterwards (tools/captures/living_view.py).
#
# * **How to run it.** Push a commit to `bakeoff-living-view` whose message carries
#   `[lv:<steps>|arms=<arms>|budget=<dollars>]` -- steps from access, download, starts, arms,
#   upscale (comma-separated, in that order); arms from ltx, causal, flf, wan; budget the dollars
#   left under the bake-off's cap (arms whose worst case -- timeout x rate -- does not fit are
#   refused). `starts=` and `contexts=` pass through. A push without a token runs nothing.
#   `workflow_dispatch` works once this file is on the default branch.
# * **What it spends**: Modal GPU time at list price, estimated per call in summary.json and
#   kept in bakeoff/living-view/cost-ledger.md. Downloads run on CPU containers; every GPU
#   function is single-use (no idle window billed). Cancelling the run cancels its Modal calls
#   (tools/captures/modal_calls.py; `exec`, so the signals reach it).
#
# Secrets: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET; the models read the Modal secret `huggingface`
# (found by its prefix, as dream.yml does).

on:
  push:
    branches: [bakeoff-living-view]
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps, in order: access,download,starts,arms,upscale"
        type: string
        default: access
      arms:
        description: "Arms: ltx,causal,flf,wan"
        type: string
        default: wan,flf,causal,ltx
      budget:
        description: "Dollars left under the cap (arms whose worst case does not fit are refused)"
        type: string
        default: "0"

concurrency:
  group: living-view
  cancel-in-progress: false

jobs:
  plan:
    name: What to run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[lv:')
    runs-on: ubuntu-latest
    outputs:
      steps: ${{ steps.plan.outputs.steps }}
      arms: ${{ steps.plan.outputs.arms }}
      budget: ${{ steps.plan.outputs.budget }}
      starts: ${{ steps.plan.outputs.starts }}
      contexts: ${{ steps.plan.outputs.contexts }}
      upscalers: ${{ steps.plan.outputs.upscalers }}
    steps:
      # Read as data, validated here, never interpolated into a shell line.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          STEPS: ${{ inputs.steps }}
          ARMS: ${{ inputs.arms }}
          BUDGET: ${{ inputs.budget }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"steps": "access", "arms": "wan,flf,causal,ltx", "budget": "0",
                     "starts": "tree-1,tree-2,camp-1,camp-2", "contexts": "1,3",
                     "upscalers": "flashvsr"}
          if os.environ["EVENT"] == "workflow_dispatch":
              for name in ("steps", "arms", "budget"):
                  options[name] = os.environ.get(name.upper(), "") or options[name]
          else:
              found = re.search(r"\[lv:([^\]|]*)((?:\|[^\]]*)?)\]", os.environ.get("MESSAGE", ""))
              options["steps"] = found.group(1)
              for part in found.group(2).split("|")[1:]:
                  name, _, value = part.partition("=")
                  if name not in options or name == "steps":
                      raise SystemExit(f"unknown option {name!r} in the [lv:] token")
                  options[name] = value
          valid = {
              "steps": r"(access|download|starts|arms|upscale)(,(access|download|starts|arms|upscale))*",
              "arms": r"(ltx|causal|flf|wan)(,(ltx|causal|flf|wan))*",
              "budget": r"[0-9]{1,2}(\.[0-9]{1,2})?",
              "starts": r"(tree|camp)-[1-9](,(tree|camp)-[1-9])*",
              "contexts": r"[1-5](,[1-5])*",
              "upscalers": r"(flashvsr)(,(flashvsr))*",
          }
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"

  run:
    name: Living view on Modal
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      STEPS: ${{ needs.plan.outputs.steps }}
      ARMS: ${{ needs.plan.outputs.arms }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      STARTS: ${{ needs.plan.outputs.starts }}
      CONTEXTS: ${{ needs.plan.outputs.contexts }}
      UPSCALERS: ${{ needs.plan.outputs.upscalers }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the Modal token is there
        run: |
          test -n "$MODAL_TOKEN_ID" -a -n "$MODAL_TOKEN_SECRET" \
            || { echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set"; exit 1; }
      # The Hugging Face secret's name in this workspace (the first whose name starts with
      # "hugging"); living_view.py reads it from HEXAPOD_HF_SECRET.
      - name: Find the Hugging Face secret
        run: |
          name="$(uv run --with modal==1.5.5 modal secret list --json | python3 -c '
          import json, sys
          rows = json.load(sys.stdin)
          names = [v for r in rows for v in (r.values() if isinstance(r, dict) else [r])
                   if isinstance(v, str) and v.lower().startswith("hugging")]
          print(names[0] if names else "huggingface")')"
          echo "Hugging Face secret: $name"
          echo "HEXAPOD_HF_SECRET=$name" >> "$GITHUB_ENV"
      - name: modal run infra/modal/living_view.py
        timeout-minutes: 170
        run: |
          exec uv run --with modal==1.5.5 modal run infra/modal/living_view.py \
            --steps "$STEPS" --arms "$ARMS" --budget-left "$BUDGET" \
            --starts-names "$STARTS" --contexts "$CONTEXTS" --upscalers "$UPSCALERS" --out lv-out
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          s = json.load(open("lv-out/summary.json"))
          print("## Living view\n")
          print("| call | GPU | seconds | $ |\n| --- | --- | ---: | ---: |")
          for r in s.get("costs", []):
              print(f"| {r['call']} | {r['gpu']} | {r['seconds']} | {r['dollars']} |")
          print(f"\nEstimated this run: ${s.get('dollars')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-view
          path: lv-out
          if-no-files-found: warn
