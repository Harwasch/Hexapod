name: Living view bake-off (Modal GPUs)

# The living-view bake-off (infra/modal/living_bakeoff.py): slight wind on the plants of a still
# render of the scan, from a video model anchored on that render -- LTX-2.5 with the
# Cinemagraph LoRA, Causal Forcing, Wan 2.1 FLF2V and Wan 2.2 TI2V-5B -- on the Minnetonka tree
# and the camp's shrubs; and the upscaler (infra/modal/living_upscale.py, FlashVSR v1.1) that
# makes every clip the render's size. Nothing is published: the starts, the clips and the
# summaries (each call's wall time and estimated dollars) are the `living-view` artifact; the
# motion-only clips and the comparison page are made from it afterwards
# (bakeoff/living-view/build_page.py with tools/captures/living_view.py).
#
# * **How to run it.** Push a commit to `bakeoff-living-view` whose message carries
#   `[lv:<steps>|arms=<arms>|budget=<dollars>]` -- steps, comma-separated in this order, from
#   access, download, starts, arms (the bake-off app) and vsr-download, vsr-check, upscale,
#   sv-download, sv-check, sv-upscale (the upscaler app: FlashVSR, then SeedVR2-3B); arms from
#   ltx, causal, flf, wan (FlashVSR takes those arms' clips, SeedVR2 those of `svarms`);
#   budget the dollars the arms
#   may spend at
#   worst (timeout x rate; an arm that does not fit is refused) and upbudget the same for the
#   upscaler. `starts=` and `contexts=` pass through. A push without a token runs nothing.
#   The step `meter` starts no container: it saves Modal's billing report for today (per app,
#   per hour, per resource: what was really metered) and, for each app id in `logs=`, that
#   app's last log lines, as the `living-meter` artifact -- for the ledger, and for a call
#   whose result never came back.
#   `workflow_dispatch` works once this file is on the default branch.
# * **What it spends**: Modal GPU time at list price, estimated per call in the summaries and
#   kept in bakeoff/living-view/cost-ledger.md. Downloads run on CPU containers; every GPU
#   function is single-use (no idle window billed). Cancelling the run cancels its Modal calls
#   (tools/captures/modal_calls.py; `exec`, so the signals reach it).
#
# Secrets: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET; the models read the Modal secret `huggingface`
# (found by its prefix, as dream.yml does).

on:
  push:
    branches: [bakeoff-living-view]
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps, in order: access,download,starts,arms,vsr-download,vsr-check,upscale,sv-download,sv-check,sv-upscale"
        type: string
        default: access
      arms:
        description: "Arms: ltx,causal,flf,wan"
        type: string
        default: wan,flf,causal,ltx
      budget:
        description: "Dollars the arms may spend at worst"
        type: string
        default: "0"
      upbudget:
        description: "Dollars the upscaler may spend at worst"
        type: string
        default: "0"

jobs:
  plan:
    name: What to run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[lv:')
    runs-on: ubuntu-latest
    outputs:
      bakeoff: ${{ steps.plan.outputs.bakeoff }}
      upscale: ${{ steps.plan.outputs.upscale }}
      arms: ${{ steps.plan.outputs.arms }}
      budget: ${{ steps.plan.outputs.budget }}
      upbudget: ${{ steps.plan.outputs.upbudget }}
      starts: ${{ steps.plan.outputs.starts }}
      contexts: ${{ steps.plan.outputs.contexts }}
      meter: ${{ steps.plan.outputs.meter }}
      logs: ${{ steps.plan.outputs.logs }}
      svarms: ${{ steps.plan.outputs.svarms }}
      winner: ${{ steps.plan.outputs.winner }}
    steps:
      # Read as data, validated here, never interpolated into a shell line.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          STEPS: ${{ inputs.steps }}
          ARMS: ${{ inputs.arms }}
          BUDGET: ${{ inputs.budget }}
          UPBUDGET: ${{ inputs.upbudget }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"steps": "access", "arms": "wan,flf,causal,ltx", "budget": "0",
                     "upbudget": "0", "starts": "tree-1,tree-2,camp-1,camp-2", "contexts": "1,3",
                     "logs": "none", "svarms": "wan,flf,causal,ltx", "winner": "ltx-p1"}
          if os.environ["EVENT"] == "workflow_dispatch":
              for name in ("steps", "arms", "budget", "upbudget"):
                  options[name] = os.environ.get(name.upper(), "") or options[name]
          else:
              found = re.search(r"\[lv:([^\]|]*)((?:\|[^\]]*)?)\]", os.environ.get("MESSAGE", ""))
              if not found:
                  raise SystemExit("no [lv:...] token")
              options["steps"] = found.group(1)
              for part in found.group(2).split("|")[1:]:
                  name, _, value = part.partition("=")
                  if name not in options or name == "steps":
                      raise SystemExit(f"unknown option {name!r} in the [lv:] token")
                  options[name] = value
          step = (r"(access|download|starts|arms|vsr-download|vsr-check|upscale"
                  r"|sv-download|sv-check|sv-upscale|meter"
                  r"|r2-prompts|r2-ladder|r2-h100|r2-stills)")
          arm = r"[a-z][a-z0-9~-]{1,30}"
          valid = {
              "steps": rf"{step}(,{step})*",
              "arms": rf"{arm}(,{arm})*",
              "svarms": rf"{arm}(,{arm})*",
              "winner": r"ltx-p[1-4]",
              "budget": r"[0-9]{1,2}(\.[0-9]{1,2})?",
              "upbudget": r"[0-9]{1,2}(\.[0-9]{1,2})?",
              "starts": r"(tree|camp)-[1-9](,(tree|camp)-[1-9])*",
              "contexts": r"[1-5](,[1-5])*",
              "logs": r"none|ap-[A-Za-z0-9]{6,40}(,ap-[A-Za-z0-9]{6,40})*",
          }
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          steps = options.pop("steps").split(",")
          upscale = {"vsr-download": "download", "vsr-check": "check", "upscale": "upscale",
                     "sv-download": "seedvr-download", "sv-check": "seedvr-check",
                     "sv-upscale": "seedvr"}
          options["bakeoff"] = ",".join(s for s in steps if s not in upscale)
          options["upscale"] = ",".join(upscale[s] for s in steps if s in upscale)
          options["meter"] = "meter" if "meter" in steps else ""
          options["bakeoff"] = ",".join(s for s in options["bakeoff"].split(",") if s != "meter")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"

  run:
    name: Living view on Modal
    needs: plan
    # One bake-off run at a time; the upscaler's job has its own lane.
    concurrency:
      group: living-view-bakeoff
      cancel-in-progress: false
    if: needs.plan.outputs.bakeoff != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      BAKEOFF: ${{ needs.plan.outputs.bakeoff }}
      UPSCALE: ${{ needs.plan.outputs.upscale }}
      ARMS: ${{ needs.plan.outputs.arms }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      UPBUDGET: ${{ needs.plan.outputs.upbudget }}
      STARTS: ${{ needs.plan.outputs.starts }}
      CONTEXTS: ${{ needs.plan.outputs.contexts }}
      WINNER: ${{ needs.plan.outputs.winner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the Modal token is there
        run: |
          test -n "$MODAL_TOKEN_ID" -a -n "$MODAL_TOKEN_SECRET" \
            || { echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set"; exit 1; }
      # The Hugging Face secret's name in this workspace (the first whose name starts with
      # "hugging"); the Modal modules read it from HEXAPOD_HF_SECRET.
      - name: Find the Hugging Face secret
        run: |
          name="$(uv run --with modal==1.5.5 modal secret list --json | python3 -c '
          import json, sys
          rows = json.load(sys.stdin)
          names = [v for r in rows for v in (r.values() if isinstance(r, dict) else [r])
                   if isinstance(v, str) and v.lower().startswith("hugging")]
          print(names[0] if names else "huggingface")')"
          echo "Hugging Face secret: $name"
          echo "HEXAPOD_HF_SECRET=$name" >> "$GITHUB_ENV"
      - name: modal run infra/modal/living_bakeoff.py
        timeout-minutes: 170
        run: |
          exec uv run --with modal==1.5.5 modal run infra/modal/living_bakeoff.py \
            --steps "$BAKEOFF" --arms "$ARMS" --budget-left "$BUDGET" \
            --starts-names "$STARTS" --contexts "$CONTEXTS" --r2-winner "$WINNER" \
            --out lv-out
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          print("## Living view\n")
          print("| call | GPU | seconds | $ |\n| --- | --- | ---: | ---: |")
          total = 0.0
          for name in ("summary.json", "upscale-summary.json"):
              path = pathlib.Path("lv-out") / name
              if path.exists():
                  for r in json.loads(path.read_text()).get("costs", []):
                      total += r["dollars"]
                      print(f"| {r['call']} | {r['gpu']} | {r['seconds']} | {r['dollars']} |")
          print(f"\nEstimated this run: ${total:.2f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-view
          path: lv-out
          if-no-files-found: warn

  upscale:
    name: Upscaler on Modal
    needs: plan
    concurrency:
      group: living-view-upscale
      cancel-in-progress: false
    if: needs.plan.outputs.upscale != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      BAKEOFF: ${{ needs.plan.outputs.bakeoff }}
      UPSCALE: ${{ needs.plan.outputs.upscale }}
      ARMS: ${{ needs.plan.outputs.arms }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      UPBUDGET: ${{ needs.plan.outputs.upbudget }}
      STARTS: ${{ needs.plan.outputs.starts }}
      CONTEXTS: ${{ needs.plan.outputs.contexts }}
      SVARMS: ${{ needs.plan.outputs.svarms }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the Modal token is there
        run: |
          test -n "$MODAL_TOKEN_ID" -a -n "$MODAL_TOKEN_SECRET" \
            || { echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set"; exit 1; }
      # The Hugging Face secret's name in this workspace (the first whose name starts with
      # "hugging"); the Modal modules read it from HEXAPOD_HF_SECRET.
      - name: Find the Hugging Face secret
        run: |
          name="$(uv run --with modal==1.5.5 modal secret list --json | python3 -c '
          import json, sys
          rows = json.load(sys.stdin)
          names = [v for r in rows for v in (r.values() if isinstance(r, dict) else [r])
                   if isinstance(v, str) and v.lower().startswith("hugging")]
          print(names[0] if names else "huggingface")')"
          echo "Hugging Face secret: $name"
          echo "HEXAPOD_HF_SECRET=$name" >> "$GITHUB_ENV"
      - name: modal run infra/modal/living_upscale.py
        timeout-minutes: 120
        run: |
          exec uv run --with modal==1.5.5 modal run infra/modal/living_upscale.py \
            --steps "$UPSCALE" --budget-left "$UPBUDGET" --arms "$ARMS" --sv-arms "$SVARMS" \
            --out lv-out
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          print("## Living view\n")
          print("| call | GPU | seconds | $ |\n| --- | --- | ---: | ---: |")
          total = 0.0
          for name in ("summary.json", "upscale-summary.json"):
              path = pathlib.Path("lv-out") / name
              if path.exists():
                  for r in json.loads(path.read_text()).get("costs", []):
                      total += r["dollars"]
                      print(f"| {r['call']} | {r['gpu']} | {r['seconds']} | {r['dollars']} |")
          print(f"\nEstimated this run: ${total:.2f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-upscale
          path: lv-out
          if-no-files-found: warn

  meter:
    name: Modal billing and logs
    needs: plan
    if: needs.plan.outputs.meter != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      LOGS: ${{ needs.plan.outputs.logs }}
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: Billing report and app logs
        run: |
          mkdir -p meter
          modal() { uv run --no-project --with modal==1.5.5 modal "$@"; }
          modal billing report --for today -r h --show-resources --json > meter/billing-today.json \
            || echo "billing report failed" > meter/billing-today.err
          modal app list --json > meter/apps.json || true
          if [ "$LOGS" != "none" ]; then
            for app in ${LOGS//,/ }; do
              modal app logs "$app" --tail 1000 --timestamps --show-container-id \
                > "meter/$app.log" 2>&1 || true
            done
          fi
          ls -la meter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-meter
          path: meter
          if-no-files-found: warn
