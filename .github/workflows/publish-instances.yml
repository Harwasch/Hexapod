name: Publish instances

# Scene segmentation (instances.json + instances.emb, docs/SCENE_OBJECTS.md §4) attached beside
# a scan's tiles, so the viewer's search / hide / highlight works on the live site. Opt-in,
# and never run by default.
#
# * **What it does.** `build`: takes the `segmentation` artifact of a `segment.yml` run (one
#   folder per scan, named as in infra/modal/segment.py `SCANS`), finds each scan's asset
#   (the `SCAN_ASSET_IDS` variable, else the one asset showing the scan's run) and its
#   CURRENT tileset URL from the API, fetches that tileset and every tile, and checks that
#   the binding covers exactly those tiles (every tile's position checksum is a key, its run
#   lengths add up to its gaussians). It writes the request beside the two files
#   (`attach.json`: the asset, `basedOn` the URL it bound against, `extras.instances`) and
#   keeps it as an artifact to review. `publish` (only when asked): stages the files in the
#   private bucket and asks the API to attach them (tools/captures/attach_sidecars.py), which
#   cuts a new generation and repoints the asset. Nothing here writes the public bucket or a
#   tileset.json (docs/DEPLOYMENT.md, "Sidecars: one publisher").
# * **How to run it.** `workflow_dispatch` once this file is on the default branch; before
#   that, push a commit whose message carries `[instances|run=<segment.yml run id>]`,
#   adding `|scans=camp,spool` to choose scans and `|publish` to publish.
#
# Variables: TWIN_API_URL, SCAN_ASSET_IDS (JSON, {"camp": "<asset id>", ...}). For `publish`
# only, secrets CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, API_WRITE_TOKEN
# and the variable R2_BUCKET (the private bucket).

on:
  push:
    branches: [living-models]
  workflow_dispatch:
    inputs:
      run:
        description: "The segment.yml run whose `segmentation` artifact to publish"
        type: string
        required: true
      scans:
        description: "Comma-separated scan names (infra/modal/segment.py SCANS)"
        type: string
        default: spool,pumpkin,camp
      publish:
        description: "Publish beside the tiles (otherwise build and review only)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: What to run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[instances|')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scans: ${{ steps.plan.outputs.scans }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Read as data, validated here, never interpolated into a shell line.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN: ${{ inputs.run }}
          SCANS: ${{ inputs.scans }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"run": "", "scans": "spool,pumpkin,camp", "publish": "false"}
          if os.environ["EVENT"] == "workflow_dispatch":
              for name in options:
                  options[name] = os.environ.get(name.upper(), "") or options[name]
          else:
              found = re.search(r"\[instances([^\]]*)\]", os.environ.get("MESSAGE", ""))
              for part in (found.group(1) if found else "").split("|")[1:]:
                  name, _, value = part.partition("=")
                  if name not in options:
                      raise SystemExit(f"unknown option {name!r} in the [instances] token")
                  options[name] = value if value else "true"
          valid = {"run": r"[0-9]+", "scans": r"[a-z0-9-]+(,[a-z0-9-]+)*", "publish": r"true|false"}
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"

  build:
    name: Bind each scan's current tiles, and the request
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCANS: ${{ needs.plan.outputs.scans }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
      SCAN_ASSET_IDS: ${{ vars.SCAN_ASSET_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: segmentation
          path: ${{ runner.temp }}/segmentation
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ github.token }}
      - name: Each scan's asset, its current tiles, and the binding checked against them
        working-directory: tools/captures
        run: |
          uv sync --frozen
          uv run --with modal==1.5.5 python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import importlib.util, json, os, shutil, urllib.request
          from pathlib import Path

          import numpy as np

          import attach_sidecars
          import rig_tiles
          from synthetic_tree import checksum_positions

          # The scans' legacy URLs (to find each one's asset by its run) and the user agent
          # the bucket accepts, from the segmentation app.
          spec = importlib.util.spec_from_file_location("segment_app", "../../infra/modal/segment.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          scans, agent = app.SCANS, app.USER_AGENT

          def get(url):
              request = urllib.request.Request(url, headers={"User-Agent": agent})
              with urllib.request.urlopen(request, timeout=300) as response:
                  return response.read()

          temp = Path(os.environ["RUNNER_TEMP"])
          print("## Instances\n")
          for name in os.environ["SCANS"].split(","):
              # The asset's CURRENT tileset: once anything was attached it is a generation,
              # not the legacy URL segment.yml read (the same tiles until a republish).
              asset = attach_sidecars.resolve_scan(name, legacy_url=scans[name])
              url = asset["url"]
              src = temp / "segmentation" / name
              doc = json.loads((src / "instances.json").read_text())
              tiles = temp / "tiles" / name
              tiles.mkdir(parents=True)
              (tiles / "tileset.json").write_bytes(get(url))
              published = json.loads((tiles / "tileset.json").read_text())
              base = url.rsplit("/", 1)[0]
              uris = rig_tiles.tile_uris(published)
              for uri in uris:
                  (tiles / uri).parent.mkdir(parents=True, exist_ok=True)
                  (tiles / uri).write_bytes(get(f"{base}/{uri}"))
                  positions = rig_tiles.tile_positions(tiles / uri)
                  runs = doc["tiles"].get(checksum_positions(positions))
                  if runs is None:
                      raise SystemExit(f"{name}: {uri} is not in instances.json's binding: "
                                       f"the asset's tiles ({url}) are not the ones segmented")
                  if int(np.sum(runs[1::2])) != positions.shape[0]:
                      raise SystemExit(f"{name}: {uri}'s runs do not cover its gaussians")
              if len(doc["tiles"]) != len(set(doc["tiles"])) or len(doc["tiles"]) < len(set(uris)):
                  raise SystemExit(f"{name}: the binding does not match the tiles")
              out = temp / "out" / name
              out.mkdir(parents=True)
              for file in ("instances.json", "instances.emb"):
                  shutil.copy(src / file, out / file)
              attach_sidecars.write_manifest(
                  out,
                  asset_id=asset["assetId"],
                  based_on=url,
                  extras={"instances": {"uri": "instances.json", "count": len(doc["instances"])}},
              )
              top = sum(1 for r in doc["instances"] if r["level"] == 0)
              print(f"- **{name}** (asset `{asset['assetId']}`): {len(uris)} tiles bound, "
                    f"{len(doc['instances']):,} instances ({top:,} top-level); {url}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: instances
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  publish:
    name: Attach beside the tiles, through the API
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish of this workflow at a time; the API serializes attaches to one asset anyway.
    concurrency:
      group: publish-instances
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OBJECT_STORAGE_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      OBJECT_STORAGE_BUCKET: ${{ vars.R2_BUCKET || 'twin-assets' }}
      API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
    steps:
      - name: The secrets this job needs
        run: |
          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY API_WRITE_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: instances
          path: ${{ runner.temp }}/out
      - name: Stage instances.json and instances.emb, and attach them
        run: |
          for folder in "$RUNNER_TEMP"/out/*/; do
            echo "::group::$(basename "$folder")"
            uv run --no-project --with boto3 python tools/captures/attach_sidecars.py attach "$folder"
            echo "::endgroup::"
          done
