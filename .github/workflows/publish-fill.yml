name: Publish fill

# An inferred layer (what an image model filled in where a scan never looked,
# tools/captures/teacher_fill.py; docs/WORLD_MODEL_RUNBOOK.md §6) attached beside a scan's
# tiles, so the viewer's "Inferred fill" toggle shows it on the live site. Opt-in, and never
# run by default.
#
# * **What it does.** `build`: takes one job folder of a `fill.yml` run's `fill` artifact
#   (`inferred.tar.gz`, the layer's own tileset), checks the layer is whole (every tile and
#   sidecar it names is there and is what it says, its evidence says `inferred`), finds the
#   scan's asset (the `SCAN_ASSET_IDS` variable, else the one asset showing the scan's run)
#   and its CURRENT tileset from the API, and checks the layer's root transform is that
#   tileset's. It writes the request beside the layer's files (`attach.json`: the asset,
#   `basedOn` that URL, and only this layer's entry of `extras.inferredLayers`, uri
#   `inferred/<name>/tileset.json` relative to the tileset as apps/web/src/lib/inferred.ts
#   resolves it -- the API merges the list by uri, so another fill's entry stays) and keeps
#   it as an artifact to review. `publish` (only when asked): stages `inferred/<name>/` in
#   the private bucket and asks the API to attach it (tools/captures/attach_sidecars.py),
#   which cuts a new generation and repoints the asset. Nothing here writes the public
#   bucket or a tileset.json (docs/DEPLOYMENT.md, "Sidecars: one publisher").
# * **How to run it.** `workflow_dispatch` once this file is on the default branch; before
#   that, push a commit whose message carries
#   `[fill|run=<fill.yml run id>|job=<artifact folder>|scan=camp]`, adding `|name=<layer>`
#   to name the folder (default: the job folder without `fill-<scan>-`) and `|publish` to
#   publish.
#
# Variables: TWIN_API_URL, SCAN_ASSET_IDS (JSON, {"camp": "<asset id>", ...}). For `publish`
# only, secrets CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, API_WRITE_TOKEN
# and the variable R2_BUCKET (the private bucket).

on:
  push:
    branches: [living-models]
  workflow_dispatch:
    inputs:
      run:
        description: "The fill.yml run whose `fill` artifact holds the layer"
        type: string
        required: true
      job:
        description: "The job's folder in that artifact, e.g. fill-camp-fixer-t50"
        type: string
        required: true
      scan:
        description: "The scan it fills (infra/modal/segment.py SCANS)"
        type: string
        default: camp
      name:
        description: "The layer's folder under inferred/ (default: the job without fill-<scan>-)"
        type: string
        default: ""
      publish:
        description: "Publish beside the tiles (otherwise build and review only)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: What to run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[fill|')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      job: ${{ steps.plan.outputs.job }}
      scan: ${{ steps.plan.outputs.scan }}
      name: ${{ steps.plan.outputs.name }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Read as data, validated here, never interpolated into a shell line.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN: ${{ inputs.run }}
          JOB: ${{ inputs.job }}
          SCAN: ${{ inputs.scan }}
          NAME: ${{ inputs.name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"run": "", "job": "", "scan": "camp", "name": "", "publish": "false"}
          if os.environ["EVENT"] == "workflow_dispatch":
              for name in options:
                  options[name] = os.environ.get(name.upper(), "") or options[name]
          else:
              found = re.search(r"\[fill([^\]]*)\]", os.environ.get("MESSAGE", ""))
              for part in (found.group(1) if found else "").split("|")[1:]:
                  name, _, value = part.partition("=")
                  if name not in options:
                      raise SystemExit(f"unknown option {name!r} in the [fill] token")
                  options[name] = value if value else "true"
          if not options["name"]:
              prefix = f"fill-{options['scan']}-"
              job = options["job"]
              options["name"] = job[len(prefix):] if job.startswith(prefix) else job
          valid = {"run": r"[0-9]+", "job": r"[a-z0-9][a-z0-9-]*", "scan": r"[a-z0-9-]+",
                   "name": r"[a-z0-9][a-z0-9-]*", "publish": r"true|false"}
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"

  build:
    name: Check the layer against the scan's current tiles, and the request
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB: ${{ needs.plan.outputs.job }}
      SCAN: ${{ needs.plan.outputs.scan }}
      LAYER: ${{ needs.plan.outputs.name }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
      SCAN_ASSET_IDS: ${{ vars.SCAN_ASSET_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: fill
          path: ${{ runner.temp }}/fill
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ github.token }}
      - name: The layer checked, the scan's current tileset, and the request
        working-directory: tools/captures
        run: |
          uv sync --frozen
          uv run --with modal==1.5.5 python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import importlib.util, json, os, struct, tarfile, urllib.request
          from pathlib import Path

          import attach_sidecars
          import rig_tiles

          # The scans' legacy URLs (to find the scan's asset by its run) and the user agent
          # the bucket accepts, from the segmentation app.
          spec = importlib.util.spec_from_file_location("segment_app", "../../infra/modal/segment.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          scan, layer = os.environ["SCAN"], os.environ["LAYER"]
          if scan not in app.SCANS:
              raise SystemExit(f"scan {scan!r} is not one of {sorted(app.SCANS)}")
          asset = attach_sidecars.resolve_scan(scan, legacy_url=app.SCANS[scan])
          url = asset["url"]

          def get(url):
              request = urllib.request.Request(url, headers={"User-Agent": app.USER_AGENT})
              with urllib.request.urlopen(request, timeout=300) as response:
                  return response.read()

          temp = Path(os.environ["RUNNER_TEMP"])
          src = temp / "fill" / os.environ["JOB"]
          out = temp / "out" / scan
          dest = out / "inferred" / layer
          dest.mkdir(parents=True)

          # The layer: one folder of plain files, nothing else in the archive.
          with tarfile.open(src / "inferred.tar.gz") as tar:
              for member in tar.getmembers():
                  parts = Path(member.name).parts
                  if member.isdir():
                      continue
                  if not member.isfile() or len(parts) != 2 or parts[0] != "inferred":
                      raise SystemExit(f"unexpected {member.name!r} in inferred.tar.gz")
                  (dest / parts[1]).write_bytes(tar.extractfile(member).read())
          inferred = json.loads((dest / "tileset.json").read_text())
          extras = inferred["root"].get("extras", {})
          evidence = extras.get("evidence") or {}
          if evidence.get("kind") != "inferred":
              raise SystemExit("the layer's root carries no inferred evidence")
          uris = rig_tiles.tile_uris(inferred)
          if not uris:
              raise SystemExit("the layer has no tiles")
          for uri in uris:
              path = dest / uri
              if "/" in uri or ".." in uri or not path.is_file():
                  raise SystemExit(f"tile {uri} is missing from the layer")
              data = path.read_bytes()
              magic, version, length = struct.unpack_from("<4sII", data)
              if magic != b"glTF" or version != 2 or length != len(data):
                  raise SystemExit(f"tile {uri} is not a whole binary glTF")
          sidecars = [v["uri"] for v in extras.values() if isinstance(v, dict) and "uri" in v]
          for uri in sidecars:
              if not (dest / uri).is_file():
                  raise SystemExit(f"sidecar {uri} is missing from the layer")
          unnamed = sorted({p.name for p in dest.iterdir()} - {"tileset.json", *uris, *sidecars})
          if unnamed:
              raise SystemExit(f"files the layer does not name: {unnamed}")

          # The scan's current tileset: the layer must be in its frame. Only the layer's own
          # entry is sent; the API merges it into the list the tileset already declares.
          current = json.loads(get(url))
          if inferred["root"]["transform"] != current["root"]["transform"]:
              raise SystemExit("the layer is not in the scan's current tileset's frame")
          entry = {"uri": f"inferred/{layer}/tileset.json", "evidence": evidence}
          attach_sidecars.write_manifest(
              out, asset_id=asset["assetId"], based_on=url, extras={"inferredLayers": [entry]}
          )
          declared = [e.get("uri") for e in current["root"].get("extras", {}).get("inferredLayers", [])]
          size = sum(p.stat().st_size for p in dest.iterdir())
          print("## Inferred fill\n")
          print(f"- **{scan}** (asset `{asset['assetId']}`): {url}")
          print(f"- layer `inferred/{layer}/`: {len(uris)} tiles, {len(sidecars)} sidecars, "
                f"{size:,} bytes; {evidence['filler']}, {evidence['views']} views, "
                f"{evidence['gaussians']:,} gaussians, mean confidence {evidence['meanConfidence']}")
          print(f"- layers declared now: {declared}"
                f"{' (this one is replaced)' if entry['uri'] in declared else ''}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inferred-fill
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  publish:
    name: Attach beside the tiles, through the API
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish per scan at a time; the API serializes attaches to one asset anyway.
    concurrency:
      group: publish-fill-${{ needs.plan.outputs.scan }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OBJECT_STORAGE_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      OBJECT_STORAGE_BUCKET: ${{ vars.R2_BUCKET || 'twin-assets' }}
      API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
    steps:
      - name: The secrets this job needs
        run: |
          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY API_WRITE_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: inferred-fill
          path: ${{ runner.temp }}/out
      - name: Stage the layer, and attach it
        env:
          SCAN: ${{ needs.plan.outputs.scan }}
        run: uv run --no-project --with boto3 python tools/captures/attach_sidecars.py attach "$RUNNER_TEMP/out/$SCAN"
