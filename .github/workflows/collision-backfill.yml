name: Collision backfill

# A collision grid for a capture published before the packer wrote one (tools/captures
# splat_tiles.py, `COLLISION_FORMAT`). Opt-in, and never run by default.
#
# * **What it does.** `build`: fetches the capture's canonical.ply (the API's
#   /captures/{id}/splat.ply redirect) and its splat asset's current tileset.json, runs
#   `splat_tiles.py collision` -- the same collision.bin `convert` now writes beside the
#   tiles -- and writes the request beside the grid (`attach.json`: the asset, `basedOn` the
#   tileset it was checked against, `extras.collision` as the command declared it), kept as
#   an artifact to review. `publish` (only when asked): stages collision.bin in the private
#   bucket and asks the API to attach it (tools/captures/attach_sidecars.py), which cuts a
#   new generation and repoints the asset. Nothing here writes the public bucket or a
#   tileset.json (docs/DEPLOYMENT.md, "Sidecars: one publisher").
# * **Identity is checked, not assumed.** The backfill refuses unless the tileset's leaves
#   hold exactly as many gaussians as the PLY keeps at `opacity_min` (the package stage's
#   parameter; 0.02 unless the run set another), and the build refuses unless the command
#   changed the tileset by `root.extras.collision` alone. The API refuses (409) when the
#   asset's tiles have changed since.
# * **How to run it.** `workflow_dispatch` once this file is on the default branch; before
#   that, push a commit whose message carries `[collision|capture=<uuid>]`, adding
#   `|publish` to publish and `|opacity_min=<value>` for a run packed with another value.
#   A re-run of the capture through the API after the worker is deployed with the new
#   packer does the same without this workflow, at the cost of re-packing every tile.
#
# Variables: TWIN_API_URL. For `publish` only, secrets CLOUDFLARE_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, API_WRITE_TOKEN and the variable R2_BUCKET (the
# private bucket).

on:
  push:
    branches: [living-models]
  workflow_dispatch:
    inputs:
      capture:
        description: "The capture's id (a UUID)"
        type: string
        required: true
      publish:
        description: "Attach collision.bin beside the tiles, through the API"
        type: boolean
        default: false
      opacity_min:
        description: "The package stage's opacity_min for this capture's run"
        type: string
        default: "0.02"

jobs:
  plan:
    name: What to run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[collision|')
    runs-on: ubuntu-latest
    outputs:
      capture: ${{ steps.plan.outputs.capture }}
      publish: ${{ steps.plan.outputs.publish }}
      opacity_min: ${{ steps.plan.outputs.opacity_min }}
    steps:
      # Read as data, validated here, never interpolated into a shell line.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          CAPTURE: ${{ inputs.capture }}
          PUBLISH: ${{ inputs.publish }}
          OPACITY_MIN: ${{ inputs.opacity_min }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"capture": "", "publish": "false", "opacity_min": "0.02"}
          if os.environ["EVENT"] == "workflow_dispatch":
              for name in options:
                  options[name] = os.environ.get(name.upper(), "") or options[name]
          else:
              found = re.search(r"\[collision([^\]]*)\]", os.environ.get("MESSAGE", ""))
              for part in (found.group(1) if found else "").split("|")[1:]:
                  name, _, value = part.partition("=")
                  if name not in options:
                      raise SystemExit(f"unknown option {name!r} in the [collision] token")
                  options[name] = value if value else "true"
          uuid = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          valid = {"capture": uuid, "publish": r"true|false", "opacity_min": r"0?\.[0-9]+|0"}
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"

  build:
    name: collision.bin from the capture's splat
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAPTURE: ${{ needs.plan.outputs.capture }}
      OPACITY_MIN: ${{ needs.plan.outputs.opacity_min }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: The capture's splat and its published tileset
        working-directory: tools/captures
        run: |
          uv sync --frozen
          # --assume-metric: the grid is in the tiles' own frame whatever the units are.
          uv run python fetch_capture.py "$CAPTURE" "$RUNNER_TEMP/work" --api "$TWIN_API_URL" \
            --assume-metric
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/work/tiles/tileset.json" "$RUNNER_TEMP/out/tileset.json"
          cp "$RUNNER_TEMP/work/capture.json" "$RUNNER_TEMP/out/capture.json"
      - name: The grid, and the request that attaches it
        working-directory: tools/captures
        run: |
          uv run python splat_tiles.py collision "$RUNNER_TEMP/work/canonical.ply" \
            "$RUNNER_TEMP/out" --tileset "$RUNNER_TEMP/out/tileset.json" \
            --opacity-min "$OPACITY_MIN" | tee "$RUNNER_TEMP/out/collision.json"
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, shutil
          from pathlib import Path

          import attach_sidecars

          temp = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((temp / "work/tiles/tileset.json").read_text())
          after = json.loads((temp / "out/tileset.json").read_text())
          extras = after["root"]["extras"].pop("collision")
          before["root"].get("extras", {}).pop("collision", None)
          if before != after:
              raise SystemExit("the command changed tileset.json by more than extras.collision")
          asset = json.loads((temp / "out/capture.json").read_text())["asset"]
          attach = temp / "out/attach"
          attach.mkdir()
          shutil.move(temp / "out/collision.bin", attach / "collision.bin")
          attach_sidecars.write_manifest(
              attach,
              asset_id=asset["id"],
              based_on=asset["source"]["url"],
              extras={"collision": extras},
          )
          size = (attach / "collision.bin").stat().st_size
          print("## Collision grid\n")
          print(f"cell {extras['cell']} m, origin {extras['origin']}, {extras['bricks']:,} "
                f"bricks, {extras['solidCells']:,} solid cells, {size:,} bytes gzipped; for "
                f"asset `{asset['id']}` at {asset['source']['url']}.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collision
          path: |
            ${{ runner.temp }}/out/
          if-no-files-found: error

  publish:
    name: Attach it beside the tiles, through the API
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish per capture at a time; the API serializes attaches to one asset anyway.
    concurrency:
      group: collision-backfill-${{ needs.plan.outputs.capture }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OBJECT_STORAGE_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      OBJECT_STORAGE_BUCKET: ${{ vars.R2_BUCKET || 'twin-assets' }}
      API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
    steps:
      - name: The secrets this job needs
        run: |
          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY API_WRITE_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: collision
          path: ${{ runner.temp }}/out
      - name: Stage collision.bin, and attach it
        run: uv run --no-project --with boto3 python tools/captures/attach_sidecars.py attach "$RUNNER_TEMP/out/attach"
