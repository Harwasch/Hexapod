name: Streamed LOD backfill

# PlayCanvas's streamed level of detail (splat-transform's lod-meta.json and SOG chunks) for a
# capture already published as 3D Tiles. Opt-in, and never run by default.
#
# * **Why.** superspl.at serves scans this way: each level of detail cut into chunks of a few
#   hundred thousand splats, stored as lossless WebP textures that the browser decodes off
#   the main thread and the GPU takes as they are; PlayCanvas chooses, fetches and caches the
#   chunks by itself against a splat budget. A trace of it walking Fort Clatsop held the main
#   thread 18% of the time at 60-117 fps. The globe's PlayCanvas renderer streams this
#   package when a scan has one (apps/web/src/cesium/scanView, `NATIVE_LOD_PATH`).
# * **What it does.** Reads the asset's CURRENT tileset URL from the API, takes every leaf
#   tile's SPZ (the leaves hold every packaged gaussian once, in the tileset's own frame),
#   merges them with splat-transform, orders them along a Morton curve, halves them four
#   times (uniform decimation: adaptive decimation of a scan this size wants a GPU), and
#   writes `sog/lod-meta.json` with the five levels, and the request beside them
#   (`attach.json`: the asset, `basedOn` the tileset whose leaves it merged,
#   `extras.nativeLod` so the viewer need not probe). The publish step (only when asked)
#   stages `sog/` in the private bucket and asks the API to attach it
#   (tools/captures/attach_sidecars.py); a staged `sog/` replaces the old one whole. Nothing
#   here writes the public bucket or a tileset.json (docs/DEPLOYMENT.md, "Sidecars: one
#   publisher").
# * **How to run it.** `workflow_dispatch` once this file is on the default branch; before
#   that, push a commit whose message carries `[streamedlod|asset=<uuid>]`, adding
#   `|publish` to publish. The asset is the scan's gaussian-splat asset (GET
#   /api/v1/assets lists them).
#
# Variables: TWIN_API_URL. For publishing only, secrets CLOUDFLARE_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, API_WRITE_TOKEN and the variable R2_BUCKET (the
# private bucket).

on:
  push:
    branches: [living-models]
  workflow_dispatch:
    inputs:
      asset:
        description: "The scan's gaussian-splat asset id (a UUID)"
        type: string
        required: true
      publish:
        description: "Attach sog/ beside the tileset, through the API"
        type: boolean
        default: false

jobs:
  plan:
    name: What to run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[streamedlod|')
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.plan.outputs.asset }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Read as data, validated here, never interpolated into a shell line.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          ASSET: ${{ inputs.asset }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          options = {"asset": "", "publish": "false"}
          if os.environ["EVENT"] == "workflow_dispatch":
              for name in options:
                  options[name] = os.environ.get(name.upper(), "") or options[name]
          else:
              found = re.search(r"\[streamedlod([^\]]*)\]", os.environ.get("MESSAGE", ""))
              for part in (found.group(1) if found else "").split("|")[1:]:
                  name, _, value = part.partition("=")
                  if name not in options:
                      raise SystemExit(f"unknown option {name!r} in the [streamedlod] token")
                  options[name] = value if value else "true"
          uuid = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          valid = {"asset": uuid, "publish": r"true|false"}
          for name, pattern in valid.items():
              if not re.fullmatch(pattern, options[name]):
                  raise SystemExit(f"{name}={options[name]!r} is not {pattern}")
          for name, value in options.items():
              print(f"{name}={value}")
          PY
          cat "$GITHUB_OUTPUT"

  build:
    name: sog/ from the asset's current tiles
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One backfill per asset at a time; the API serializes attaches to one asset anyway.
    concurrency:
      group: streamed-lod-${{ needs.plan.outputs.asset }}
      cancel-in-progress: false
    env:
      ASSET: ${{ needs.plan.outputs.asset }}
      TWIN_API_URL: ${{ vars.TWIN_API_URL || 'https://twin-api.fly.dev' }}
    steps:
      # The runner context is not available to a job's env, so the work directory is set here.
      - name: Work directory
        run: echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The asset's current tileset
        run: |
          uv run --no-project python tools/captures/attach_sidecars.py resolve --asset "$ASSET" \
            --out "$RUNNER_TEMP/asset.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re
          url = json.load(open(os.environ["RUNNER_TEMP"] + "/asset.json"))["url"]
          # Read as data and checked before it goes anywhere near a shell line.
          if not re.fullmatch(r"https://[A-Za-z0-9.-]+/[A-Za-z0-9._/-]+/tileset\.json", url):
              raise SystemExit(f"the asset's tileset {url!r} is not a tileset.json URL")
          print(f"TILESET={url}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: splat-transform (MIT), pinned
        run: npm install --prefix "$RUNNER_TEMP/st" @playcanvas/splat-transform@3.8.0
      - name: Every leaf tile's SPZ
        run: |
          mkdir -p "$WORK/spz"
          python3 - <<'PY'
          import json, os, struct, urllib.request
          tileset = os.environ["TILESET"]
          base = tileset.rsplit("/", 1)[0] + "/"
          work = os.environ["WORK"]
          get = lambda url: urllib.request.urlopen(
              urllib.request.Request(url, headers={"User-Agent": "streamed-lod-backfill"})
          ).read()
          root = json.loads(get(tileset))["root"]
          leaves, stack = [], [root]
          while stack:
              tile = stack.pop()
              stack.extend(tile.get("children", []))
              if not tile.get("children"):
                  leaves.append(tile)
          count = 0
          for tile in leaves:
              uri = tile["content"]["uri"]
              data = get(base + uri)
              length = struct.unpack_from("<I", data, 12)[0]
              doc = json.loads(data[20 : 20 + length])
              offset = 20 + length
              blob = data[offset + 8 : offset + 8 + struct.unpack_from("<I", data, offset)[0]]
              ext = doc["meshes"][0]["primitives"][0]["extensions"]["KHR_gaussian_splatting"]
              view = doc["bufferViews"][ext["extensions"]["KHR_gaussian_splatting_compression_spz_2"]["bufferView"]]
              start = view.get("byteOffset", 0)
              name = uri.rsplit("/", 1)[-1].removesuffix(".glb")
              with open(f"{work}/spz/{name}.spz", "wb") as out:
                  out.write(blob[start : start + view["byteLength"]])
              count += tile.get("extras", {}).get("gaussians", 0)
          print(f"{len(leaves)} leaves, {count} gaussians")
          PY
      - name: Five levels, then lod-meta.json
        run: |
          st() { node "$RUNNER_TEMP/st/node_modules/@playcanvas/splat-transform/bin/cli.mjs" -w -g cpu "$@"; }
          cd "$WORK"
          st spz/*.spz full.ply
          st full.ply -m lod0.ply && rm full.ply spz -rf
          for level in 1 2 3 4; do st "lod$((level - 1)).ply" --decimate 50% "lod$level.ply"; done
          mkdir -p out/sog
          st lod0.ply -l 0 lod1.ply -l 1 lod2.ply -l 2 lod3.ply -l 3 lod4.ply -l 4 out/sog/lod-meta.json
          du -sh out/sog
          echo "### sog/ for $TILESET: $(du -sh out/sog | cut -f1), $(find out/sog -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
      - name: The request that attaches sog/
        run: |
          uv run --no-project python tools/captures/attach_sidecars.py manifest "$WORK/out" \
            --asset "$ASSET" --based-on "$TILESET" --extras '{"nativeLod": "sog/lod-meta.json"}' \
            > /dev/null
          echo "$(jq '.files | length' "$WORK/out/attach.json") files to attach to asset \`$ASSET\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage sog/, and attach it
        if: needs.plan.outputs.publish == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OBJECT_STORAGE_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          OBJECT_STORAGE_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OBJECT_STORAGE_BUCKET: ${{ vars.R2_BUCKET || 'twin-assets' }}
          API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY API_WRITE_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing. See docs/DEPLOYMENT.md."
            exit 1
          fi
          uv run --no-project --with boto3 python tools/captures/attach_sidecars.py attach "$WORK/out"
