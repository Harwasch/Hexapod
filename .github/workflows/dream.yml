name: Dream clips (Modal GPU, Wan 2.2 and Cosmos-Predict2)

# Deploys infra/modal/world_models.py (the video models), then runs infra/modal/dream.py:
# start frames of published scans drawn with gsplat, a clip per start x prompt x model with a
# contact sheet, and the video teacher for materials (C2) fitted to Wan clips of the camp's
# plants. Uploads clips, sheets, stills and the fitted materials.json as the `dream`
# artifact. Nothing is published. See docs/WORLD_MODEL_RUNBOOK.md, section 8.
#
# On a push to a `wm-*` working branch that touches the dream code (not `living-models`, so
# merges there start no GPU run). The Modal token is the repository's; the video models read
# the Modal secret `huggingface` (HF_TOKEN).
#
# Cancelling the run (or its timeout) cancels the Modal calls it started: dream.py tracks
# every call and cancels the ones still out there on SIGINT, SIGTERM or an exception
# (tools/captures/modal_calls.py). Without that, the clips -- queued on the deployed app,
# which outlives the run -- went on billing H100s after the job had gone.

on:
  push:
    branches: ["wm-*"]
    paths:
      - infra/modal/dream.py
      - infra/modal/world_models.py
      - tools/captures/teacher_materials.py
      - .github/workflows/dream.yml
  workflow_dispatch:
    inputs:
      scans:
        description: Scans to dream from (camp, pumpkin; empty for none)
        type: string
        default: camp,pumpkin
      models:
        description: Video models (Wan, Cosmos)
        type: string
        default: Wan,Cosmos
      instances:
        description: Camp instances to fit materials to (empty for none)
        type: string
        default: 225,244,113,414,231
      chain:
        description: Wan calls per materials clip, each from the last frame
        type: string
        default: "3"

# One dream run at a time, whichever branch or dispatch started it: every run redeploys the
# same `hexapod-world-models` app and shares its 4 Wan and 2 Cosmos containers, so a second
# run alongside only queues behind the first (each wait counting against its clips'
# timeouts) and swaps the app's code under it. Not cancel-in-progress: a push does not throw
# away a run already paid for.
concurrency:
  group: dream
  cancel-in-progress: false

env:
  SCANS: ${{ inputs.scans || 'camp,pumpkin' }}
  MODELS: ${{ inputs.models || 'Wan,Cosmos' }}
  PROMPTS: gentle,gusty,rain
  INSTANCES: ${{ inputs.instances || '225,244,113,414,231' }}
  CHAIN: ${{ inputs.chain || '3' }}

jobs:
  dream:
    name: Dream on Modal GPUs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the Modal token is there
        run: |
          test -n "$MODAL_TOKEN_ID" -a -n "$MODAL_TOKEN_SECRET" \
            || { echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set"; exit 1; }
      - name: Modal secrets present (names only)
        continue-on-error: true
        run: uv run --with modal==1.5.5 modal secret list
      # The Hugging Face secret's name in this workspace (the first whose name starts with
      # "hugging"); world_models.py reads it from HEXAPOD_HF_SECRET.
      - name: Find the Hugging Face secret
        run: |
          name="$(uv run --with modal==1.5.5 modal secret list --json | python3 -c '
          import json, sys
          rows = json.load(sys.stdin)
          names = [v for r in rows for v in (r.values() if isinstance(r, dict) else [r])
                   if isinstance(v, str) and v.lower().startswith("hugging")]
          print(names[0] if names else "huggingface")')"
          echo "Hugging Face secret: $name"
          echo "HEXAPOD_HF_SECRET=$name" >> "$GITHUB_ENV"
      - name: modal deploy infra/modal/world_models.py
        run: uv run --with modal==1.5.5 modal deploy infra/modal/world_models.py
      # `exec`, so the runner's SIGINT and SIGTERM reach dream.py (uv passes them on) and it
      # can cancel its calls. GitHub signals only the step's shell, which otherwise sits out
      # SIGINT and dies on SIGTERM, and modal is killed afterwards without ever seeing one.
      # The step's own timeout stops it the same way, before the job's, so the artifact
      # below is still uploaded.
      - name: modal run infra/modal/dream.py
        timeout-minutes: 200
        run: |
          exec uv run --with modal==1.5.5 modal run infra/modal/dream.py \
            --scans "$SCANS" --models "$MODELS" --prompts "$PROMPTS" \
            --instances "$INSTANCES" --chain "$CHAIN" --out dream-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream
          path: dream-out
          if-no-files-found: warn
