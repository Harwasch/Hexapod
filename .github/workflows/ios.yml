name: iOS

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Archive, sign and upload to TestFlight
        type: boolean
        default: false
      bundle_id:
        description: Registered App Store Connect bundle identifier
        type: string
        default: com.harwasch.hex

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 explicitly
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            apps/ios/Modules/*/.build
            apps/ios/App/.build
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('apps/ios/**/Package.swift', 'apps/ios/**/Package.resolved') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Bundle local globe
        run: |
          pnpm install --frozen-lockfile
          bash apps/ios/ci_scripts/build_globe.sh
      - name: Build every package for iOS Simulator
        run: python3 apps/ios/ci_scripts/packages.py build
      - name: Upload ios-package-logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-package-logs
          path: apps/ios/build/package-logs
          if-no-files-found: warn

  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 explicitly
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            apps/ios/Modules/*/.build
            apps/ios/App/.build
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('apps/ios/**/Package.swift', 'apps/ios/**/Package.resolved') }}
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: apps/ios/build/DerivedData
          key: ${{ runner.os }}-xcode26-app-${{ hashFiles('apps/ios/project.yml', 'apps/ios/**/Package.swift', 'apps/ios/**/Package.resolved') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Bundle local globe
        run: |
          pnpm install --frozen-lockfile
          bash apps/ios/ci_scripts/build_globe.sh
      - name: Share globe resources with simulator tests
        uses: actions/upload-artifact@v4
        with:
          name: ios-globe-resources
          path: apps/ios/Modules/Globe/Sources/Globe/Resources/GlobeWeb
          if-no-files-found: error
      - name: Generate project
        run: |
          brew install xcodegen xcbeautify
          cd apps/ios
          xcodegen generate
      - name: Build without signing
        working-directory: apps/ios
        env:
          HEX_BUNDLE_ID: ${{ inputs.bundle_id }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build -project Hex.xcodeproj -scheme Hex -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -jobs 4 -skipMacroValidation \
            -derivedDataPath build/DerivedData \
            HEX_BUNDLE_ID="$HEX_BUNDLE_ID" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/app.log | xcbeautify
      - name: Show every build error
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### App build errors (raw log)'
            echo '```text'
            if [[ -f apps/ios/build/app.log ]]; then
              grep 'error:' apps/ios/build/app.log || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ios-app-log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-log
          path: apps/ios/build/app.log
          if-no-files-found: warn

  tests:
    needs: app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 explicitly
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            apps/ios/Modules/*/.build
            apps/ios/App/.build
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('apps/ios/**/Package.swift', 'apps/ios/**/Package.resolved') }}
      - uses: actions/download-artifact@v4
        with:
          name: ios-globe-resources
          path: apps/ios/Modules/Globe/Sources/Globe/Resources/GlobeWeb
      - name: Test packages on an available iPhone simulator
        run: python3 apps/ios/ci_scripts/packages.py test
      - name: Upload ios-test-logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: apps/ios/build/test-logs
          if-no-files-found: warn

  testflight:
    if: ${{ inputs.testflight }}
    needs: [packages, app, tests]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check signing secrets
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ready=true
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::notice::TestFlight skipped: missing $name"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == false ]]; then
            echo 'TestFlight skipped: configure all four signing secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.ready == 'true'
      - name: Select Xcode 26 explicitly
        if: steps.signing.outputs.ready == 'true'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Cache SwiftPM
        if: steps.signing.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            apps/ios/Modules/*/.build
            apps/ios/App/.build
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('apps/ios/**/Package.swift', 'apps/ios/**/Package.resolved') }}
      - name: Cache DerivedData
        if: steps.signing.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: apps/ios/build/DerivedData
          key: ${{ runner.os }}-xcode26-app-${{ hashFiles('apps/ios/project.yml', 'apps/ios/**/Package.swift', 'apps/ios/**/Package.resolved') }}
      - uses: pnpm/action-setup@v4
        if: steps.signing.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - name: Bundle local globe
        if: steps.signing.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          bash apps/ios/ci_scripts/build_globe.sh
      - name: Generate project
        if: steps.signing.outputs.ready == 'true'
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate
      - name: Prepare API key and export options
        if: steps.signing.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          signing_dir="$RUNNER_TEMP/hex-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$signing_dir"
          printf '%s' "$ASC_KEY_P8" > "$signing_dir/AuthKey.p8"
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib

          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              f'hex-signing-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}'
          )
          options = {
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
              "uploadSymbols": True,
          }
          (directory / "ExportOptions.plist").write_bytes(plistlib.dumps(options))
          PY
      - name: Archive and upload
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HEX_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          signing_dir="$RUNNER_TEMP/hex-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$signing_dir/AuthKey.p8"
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project Hex.xcodeproj -scheme Hex -configuration Release \
            -destination 'generic/platform=iOS' -jobs 4 \
            -archivePath "$signing_dir/Hex.xcarchive" "${auth[@]}" \
            -derivedDataPath build/DerivedData \
            HEX_BUNDLE_ID="$HEX_BUNDLE_ID" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          xcodebuild -exportArchive -archivePath "$signing_dir/Hex.xcarchive" \
            -exportOptionsPlist "$signing_dir/ExportOptions.plist" \
            -exportPath "$signing_dir/export" "${auth[@]}"
      - name: Remove signing material
        if: ${{ always() && steps.signing.outputs.ready == 'true' }}
        run: rm -rf -- "$RUNNER_TEMP/hex-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
