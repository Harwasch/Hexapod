# Local development dependencies. Start with:  docker compose -f infra/docker-compose.yml up -d
# (or `pnpm infra:up` from the repo root). Nothing here is needed in production.
name: twin

services:
  postgis:
    image: postgis/postgis:16-3.5
    container_name: twin-postgis
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twin
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./postgis/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # quay.io, not Docker Hub: MinIO deleted the minio/minio and minio/mc
    # repositories from Docker Hub on 2026-09-11 (the community edition was
    # archived in February), so an anonymous pull now fails with "repository
    # does not exist". The same images and tags are still published on MinIO's
    # own registry.
    image: quay.io/minio/minio:latest
    container_name: twin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twin
      MINIO_ROOT_PASSWORD: twin-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates the bucket and applies its CORS rule. A fresh dev
  # environment needs both: without CORS the browser cannot PUT to a presigned
  # URL, and without ExposeHeaders: ["ETag"] it reads etag === null off the
  # response and a multipart upload can never be completed.
  #
  # `mc cors set ALIAS/BUCKET FILE` takes XML (the JSON form in infra/cors/ is
  # what aws-cli, boto3 and R2 take), which is why dev-minio.xml exists. The
  # subcommand was added to mc in 2024; the `||` branch is there because an
  # older pinned mc would otherwise fail the whole one-shot silently-ish, and a
  # dev who sees the message can apply the rule by hand.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./cors:/cors:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 twin twin-secret &&
      mc mb --ignore-existing local/twin-assets &&
      mc anonymous set download local/twin-assets &&
      { mc cors set local/twin-assets /cors/dev-minio.xml ||
      echo 'WARNING: CORS not applied - update mc, or apply it with boto3 put_bucket_cors (docs/DEPLOYMENT.md). Browser uploads will fail until you do.' ; }
      "

volumes:
  postgis-data:
  minio-data:
