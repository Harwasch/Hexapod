# Local development dependencies. Start with:  docker compose -f infra/docker-compose.yml up -d
# (or `pnpm infra:up` from the repo root). Nothing here is needed in production.
name: twin

services:
  postgis:
    image: postgis/postgis:16-3.5
    container_name: twin-postgis
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twin
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./postgis/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: twin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twin
      MINIO_ROOT_PASSWORD: twin-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates the bucket used for site thumbnails.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 twin twin-secret &&
      mc mb --ignore-existing local/twin-assets &&
      mc anonymous set download local/twin-assets
      "

volumes:
  postgis-data:
  minio-data:
