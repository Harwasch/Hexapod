[project]
name = "hex-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pillow>=10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401", "RUF012", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["../pipeline"]

[[tool.mypy.overrides]]
module = ["modal.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["capture_bundle", "video"]
follow_imports = "silent"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
