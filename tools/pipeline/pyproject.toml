[project]
name = "twin-pipeline"
version = "0.1.0"
description = "Recipe-driven capture processing: ordered stages, a stage registry, and the runner seam."
requires-python = ">=3.12"
dependencies = [
  # Recipes are YAML; nothing else in this project reads or writes YAML.
  "pyyaml>=6.0",
  # tools/captures' splat_tiles.convert is imported through captures_bridge.py, and it
  # needs numpy. Declared here so the seam is importable rather than aspirational.
  "numpy>=1.26",
  # The normalize stage's real implementation (A8/B2) shells out to ffmpeg. A0 found
  # ffmpeg is not preinstalled on ubuntu-latest and static-ffmpeg downloads binaries at
  # import, so the choice is pinned now and tests/test_ffmpeg.py holds it to it.
  "imageio-ffmpeg>=0.5",
  "pillow>=10",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.13",
  "mypy>=1.18",
  "types-pyyaml>=6.0",
]

[tool.uv]
# Scripts run from this directory; there is nothing to build or install.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401", "RUF012", "S101"]

[tool.ruff.lint.isort]
# Every module in this project is imported by bare name (the tools/captures convention),
# so ruff cannot tell them from third-party packages without being told.
known-first-party = [
  "adapters",
  "artifacts",
  "block_maths",
  "block_trainer",
  "block_views",
  "blocks",
  "captures_bridge",
  "cloud",
  "cloud_stages",
  "conftest",
  "contracts",
  "errors",
  "executor",
  "holdout",
  "holdout_error",
  "holdout_maths",
  "holdout_stand_in",
  "host",
  "live",
  "lod_maths",
  "lod_optimise",
  "lod_parents",
  "modal_adapter",
  "phases",
  "plan",
  "progress",
  "providers",
  "quality",
  "quality_in_memory",
  "recipe",
  "registry",
  "run_recipe",
  "run_stage",
  "runners",
  "sfm",
  "splat_tiles",
  "stages",
  "synthetic_scene",
  "test_train_gsplat",
  "training",
  "tree_frames",
  "video",
  "workdir",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.mypy]
# 3.12, matching requires-python, and the two must stay equal. When the floor was 3.11
# uv was free to build a 3.11 venv here and a 3.12 one on CI; mypy then parsed the 3.12
# venv's numpy stubs under 3.11 rules and rejected PEP 695 `type` statements that only
# exist in the newer file. The API requires 3.12 and its worker imports this project, so
# 3.11 was never a version this code actually had to run on.
python_version = "3.12"
strict = true
# tests/loop_stand_in/ (and tests/lod_stand_in/, for lod_optimise.py) holds a stand-in
# `gsplat` package and `simple_trainer.py`, only ever imported by converge_trainer.py (or
# lod_optimise.py) from the trainer's directory at run time. Checked as
# part of this tree, its `gsplat` would shadow the real one's `Any` for every module here.
exclude = ["\\.venv", "^tests/loop_stand_in/", "^tests/lod_stand_in/"]
# splat_tiles lives in the sibling uv project tools/captures, which is `package = false`
# and so cannot be a path dependency. captures_bridge.py puts it on sys.path at runtime;
# this is how mypy sees the same file, so the seam is type-checked rather than Any.
mypy_path = ["../captures"]

[[tool.mypy.overrides]]
# Type-check calls into splat_tiles against its real signatures, but do not report errors
# inside tools/captures -- that project does not run mypy and is not this project's to fix.
module = ["splat_tiles"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `modal` is deliberately not a dependency: modal_adapter.py has never been executed and
# must not pull a client library into an image that does not use it. The import is inside
# the one function that needs it and is guarded, so the module still type-checks here.
module = ["modal.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# holdout_error.py runs on the training box, under the trainer's CPython 3.10 venv with
# torch, gsplat and gsplat's examples/datasets on its path. None of them is a dependency
# of this project; the imports are inside `main`, and they type as Any here.
# lod_optimise.py likewise, and it also reaches for gsplat's trainer's `fused_ssim` and
# torchmetrics' LPIPS, both optional there.
module = [
  "torch",
  "torch.*",
  "gsplat",
  "gsplat.*",
  "datasets",
  "datasets.*",
  "fused_ssim",
  "torchmetrics",
  "torchmetrics.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Same convention as tools/captures: run from this directory, import by module name.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
