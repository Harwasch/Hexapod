# Lane 1 -- the capture is already reconstructed.
#
# Scaniverse, Polycam, Postshot and Luma export Gaussian splats directly, so there is
# nothing to reconstruct: normalise, georeference, package, register. No GPU, under a
# minute. This is the lane that makes the phone experience feel instant.
#
# A8 makes every stage here real. It also inserts `thumbnail`, `ground_samples` and
# `manifest` between `package` and `register` -- which is a recipe edit and three
# decorators, with no executor, runner or schema change.
name: splat-ingest
version: 1
description: Package an already-reconstructed splat and register it as a site.

# Seeded into <workdir>/inputs/upload before the run, by the worker (A7) out of object
# storage.
inputs: [upload]

stages:
  - id: normalize
    impl: ingest_splat # | ply_compressed | spz
    params:
      opacity_min: 0.02

  - id: georeference
    impl: manual_placement # | exif_gps | arkit_scale
    params:
      lat: 0.0
      lon: 0.0
      height: 0.0
      uncertainty_m: 0.0

  - id: package
    impl: splat_tiles # tools/captures/splat_tiles.py, unchanged
    params:
      max_gaussians: 400000
      geometric_error: 2.0

  - id: register
    impl: catalog
    params: {}
