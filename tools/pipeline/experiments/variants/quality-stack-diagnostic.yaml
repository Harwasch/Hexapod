# Diagnostics beside the Beach A/B, not part of it. Same frames, poses, seed and schedule.
# upgraded-plain: today's recipe on the new gsplat; the upgrade itself is not behind a flag.
# all-on-no-3dgut: B without 3DGUT. A beach screen measured the export 5.45 dB under the trainer's
# own eval with 3DGUT on (d4a0e304) and 0.00 dB with it off (9ae10e24): classic renderers, which
# is what the bench test and our viewers are, do not reproduce a splat trained under eval3d.
all-on-no-ppisp:
  train:
    with_ut: true
    with_eval3d: true
    packed: false
    budget_max: 3456214
    antialiased: false
    pose_opt: true
    batch_size: 1
    blocks: 1
    init: sfm+dense
    dense_chunk: 16
    priors:
      depth_weight: 0.05
      normal_weight: 0.02
      start_step: 1000
    aniso_cap:
      ratio: 10
      weight: 0.001
    far_field: sphere
    far_field_share: 0.1
    far_field_count: 256
  quality:
    bar: fade
    context_fade: 0.5
upgraded-plain: {}
all-on-no-3dgut:
  train:
    with_ut: false
    with_eval3d: false
    budget_max: 3456214
    step_max_side: 800
