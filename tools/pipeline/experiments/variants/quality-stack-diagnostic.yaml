    pose_opt: true
    post_processing: ppisp
    ppisp_use_controller: false
    ppisp_display_referred: true
    batch_size: 1
    blocks: 1
    init: sfm+dense
    dense_chunk: 16
    priors:
      depth_weight: 0.05
      normal_weight: 0.02
      start_step: 1000
      max_side: 400
    aniso_cap:
