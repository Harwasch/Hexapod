# Baseline-main was measured from c7fb90c8 with gsplat 1.5.3. Do not rerun that
# label on the new image. Rehearsals are synthetic and may exercise all six labels.
# All paid arms, screens, freezes and retries share --tag quality-stack --total-cap 30.
# Candidate weights are unmeasured. No production defaults flip in this change.
baseline-main: {}
upgraded:
  train: &upgraded
    with_ut: true
    with_eval3d: true
    pose_opt: true
    blocks: 1
+dense:
  train: &dense
    <<: *upgraded
    init: sfm+dense
+priors+aniso:
  train: &priors
    <<: *dense
    priors:
      depth_weight: 0.05
      normal_weight: 0.02
      start_step: 1000
    aniso_cap:
      ratio: 10
      weight: 0.001
+sky-far-cap:
  train: &far
    <<: *priors
    far_field: sphere
    far_field_share: 0.1
    far_field_count: 256
all-on:
  train: *far
  quality:
    bar: fade
    context_fade: 0.5
