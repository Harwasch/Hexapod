[project]
name = "twin-api"
version = "0.1.0"
description = "Catalog and site API for the geospatial digital twin."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0.43",
  "geoalchemy2>=0.18",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "shapely>=2.1",
  "httpx>=0.28",
  "boto3>=1.40",
  "python-multipart>=0.0.20",
  "anthropic>=1.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6",
  "ruff>=0.13",
  "mypy>=1.18",
  "pip-audit>=2.9",
  "boto3-stubs[s3]>=1.40",
  "types-shapely>=2.1",
  "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401", "RUF012", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"alembic/**" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["\\.venv", "alembic/versions"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]
