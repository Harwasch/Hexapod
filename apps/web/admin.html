<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta
      name="description"
      content="Everything in storage, every run that produced it, and the form that launches more."
    />
    <!-- Not a public page: it lists storage keys, run parameters and costs. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Self-hosted fonts, the same two faces index.html declares and explains. -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-v4-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/azeret-mono-v21-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Instrument Sans";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("/fonts/instrument-sans-v4-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Azeret Mono";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("/fonts/azeret-mono-v21-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <title>Data console</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- A third entry, and deliberately not a panel inside the globe app: a hundred runs
         and their parameters do not fit over a 3D scene, and this page has no use for a
         globe. `pnpm build` produces three entries and e2e/admin.spec.ts asserts that no
         cesium chunk is requested by this one. -->
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
