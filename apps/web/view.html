<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Scans</title>
    <!-- Self-hosted fonts, the same two faces index.html declares and explains; the page's
         styles are src/view/view.css, on the shared design tokens. -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-v4-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/azeret-mono-v21-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Instrument Sans";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("/fonts/instrument-sans-v4-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Azeret Mono";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("/fonts/azeret-mono-v21-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Before the bundled stylesheet lands: the page's ink, so it never flashes white. */
      html {
        background: #0b0c0a;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <main id="gallery" class="gallery" hidden>
      <h1>Scans</h1>
      <p id="gallery-status">Loading…</p>
      <ul id="cards" class="cards"></ul>
    </main>

    <section id="viewer" class="viewer" hidden aria-label="3D scan">
      <div class="bar">
        <a class="back" href="#">All scans</a>
        <div class="title">
          <strong id="scan-name"></strong>
          <span id="scan-date"></span>
        </div>
        <button id="coverage" class="toggle" type="button" aria-pressed="false" hidden>
          Coverage
        </button>
      </div>
      <div id="coverage-legend" class="legend" hidden>
        <p>
          <span><i class="dot dot--keep"></i>High quality</span>
          <span><i class="dot dot--context"></i>Context</span>
          <span><i class="dot dot--drop"></i>Dropped</span>
          <span><i class="dot dot--camera"></i>Camera path</span>
        </p>
        <p id="coverage-counts" class="counts"></p>
      </div>
      <p id="viewer-status" class="note" aria-live="polite">Loading the scan…</p>
    </section>

    <section id="live" class="viewer" hidden aria-label="Live reconstruction">
      <div class="bar">
        <a class="back" href="#">All scans</a>
        <div class="title">
          <strong id="live-name">Live</strong>
          <span
            ><i class="live-dot" aria-hidden="true"></i>Live · cameras as solved, splats as
            trained</span
          >
        </div>
      </div>
      <div class="live-panel">
        <p id="live-status" aria-live="polite">Connecting…</p>
        <div
          id="live-track"
          class="live-track"
          role="progressbar"
          aria-labelledby="live-status"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          hidden
        >
          <div id="live-bar"></div>
        </div>
        <p id="live-detail" class="live-detail" aria-live="polite"></p>
        <a id="live-final" class="live-final" href="#" hidden>Finished — open the final scan</a>
      </div>
    </section>

    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
