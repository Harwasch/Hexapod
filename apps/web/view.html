<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0b0c0a" />
    <title>Scans</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c0a;
        --surface: #161a13;
        --border: rgba(255, 255, 255, 0.14);
        --fg: #f2f6ef;
        --muted: rgba(242, 246, 239, 0.74);
        --accent: #7fd8c0;
        --on-accent: #0b1410;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      a {
        color: inherit;
      }
      /* Gallery */
      .gallery {
        max-width: 960px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top, 0px) + 28px) 16px 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .gallery h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      .gallery p {
        margin: 0;
        color: var(--muted);
      }
      .cards {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: var(--surface);
        text-decoration: none;
      }
      .card:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .card img,
      .card .blank {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #20261c;
        display: block;
      }
      .card .meta {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .card strong {
        font-weight: 650;
      }
      .card span {
        color: var(--muted);
        font-size: 0.875rem;
      }
      /* Viewer */
      .viewer {
        position: fixed;
        inset: 0;
      }
      .viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(rgba(11, 12, 10, 0.85), rgba(11, 12, 10, 0));
        pointer-events: none;
      }
      .bar > * {
        pointer-events: auto;
      }
      .back {
        flex: none;
        white-space: nowrap;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(22, 26, 19, 0.9);
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-weight: 600;
      }
      .title {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .title strong {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title span {
        color: var(--muted);
        font-size: 0.8125rem;
      }
      .toggle {
        flex: none;
        margin-left: auto;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(22, 26, 19, 0.9);
        color: var(--fg);
        font: inherit;
        font-weight: 600;
      }
      .toggle[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .toggle:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .legend {
        position: fixed;
        left: 16px;
        right: 16px;
        top: calc(env(safe-area-inset-top, 0px) + 68px);
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(22, 26, 19, 0.88);
        border: 1px solid var(--border);
        font-size: 0.8125rem;
      }
      .legend p {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend .counts {
        margin-top: 4px;
        color: var(--muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      /* tools/pipeline/quality.py TIER_COLOURS */
      .dot--keep {
        background: rgb(64, 196, 108);
      }
      .dot--context {
        background: rgb(238, 170, 52);
      }
      .dot--drop {
        background: rgb(132, 136, 130);
      }
      .dot--camera {
        background: #ffffff;
      }
      .note {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 10px 16px;
        border-radius: 12px;
        background: rgba(22, 26, 19, 0.92);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.875rem;
        text-align: center;
      }
      /* Live mode: a run as it happens */
      .live-panel {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(22, 26, 19, 0.92);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .live-panel p {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #live-status {
        font-weight: 650;
      }
      .live-detail {
        color: var(--muted);
        font-size: 0.875rem;
      }
      .live-track {
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .live-track > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.4s ease;
      }
      .live-final {
        align-self: flex-start;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-weight: 650;
      }
      .live-final:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 2px;
      }
      .live-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        background: #e5484d;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <main id="gallery" class="gallery" hidden>
      <h1>Scans</h1>
      <p id="gallery-status">Loading…</p>
      <ul id="cards" class="cards"></ul>
    </main>

    <section id="viewer" class="viewer" hidden aria-label="3D scan">
      <div class="bar">
        <a class="back" href="#">All scans</a>
        <div class="title">
          <strong id="scan-name"></strong>
          <span id="scan-date"></span>
        </div>
        <button id="coverage" class="toggle" type="button" aria-pressed="false" hidden>
          Coverage
        </button>
      </div>
      <div id="coverage-legend" class="legend" hidden>
        <p>
          <span><i class="dot dot--keep"></i>High quality</span>
          <span><i class="dot dot--context"></i>Context</span>
          <span><i class="dot dot--drop"></i>Dropped</span>
          <span><i class="dot dot--camera"></i>Camera path</span>
        </p>
        <p id="coverage-counts" class="counts"></p>
      </div>
      <p id="viewer-status" class="note" aria-live="polite">Loading the scan…</p>
    </section>

    <section id="live" class="viewer" hidden aria-label="Live reconstruction">
      <div class="bar">
        <a class="back" href="#">All scans</a>
        <div class="title">
          <strong id="live-name">Live</strong>
          <span
            ><i class="live-dot" aria-hidden="true"></i>Live · cameras as solved, splats as
            trained</span
          >
        </div>
      </div>
      <div class="live-panel">
        <p id="live-status" aria-live="polite">Connecting…</p>
        <div
          id="live-track"
          class="live-track"
          role="progressbar"
          aria-labelledby="live-status"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          hidden
        >
          <div id="live-bar"></div>
        </div>
        <p id="live-detail" class="live-detail" aria-live="polite"></p>
        <a id="live-final" class="live-final" href="#" hidden>Finished — open the final scan</a>
      </div>
    </section>

    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
