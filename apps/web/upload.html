<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The handoff token rides in the URL fragment. Keep it out of anything that leaves
         the device: no referrer, and nothing here loads a third-party resource. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Send a capture</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0b0f14;
        --fg: #e8eef5;
        --muted: #93a4b8;
        --accent: #5cc8ff;
        --track: #1c2836;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fb;
          --fg: #11181f;
          --muted: #5a6b7d;
          --accent: #0b74c4;
          --track: #dfe6ee;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      /* A 56px target: this is used one-handed, on a phone, possibly outdoors. */
      .pick {
        display: block;
        width: 100%;
        min-height: 56px;
        display: grid;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        border-radius: 14px;
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--fg);
        font-weight: 600;
        cursor: pointer;
      }
      .pick:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .track {
        margin-top: 1.25rem;
        height: 10px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--accent);
        transition: width 120ms linear;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar {
          transition: none;
        }
      }
      #status {
        margin-top: 1rem;
        font-weight: 600;
      }
      #detail {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Send a capture</h1>
      <p>
        This uploads straight from your phone to the survey. Keep the page open until it finishes.
      </p>

      <div id="form">
        <label class="pick">
          Choose a video, photos or a scan
          <input
            id="file"
            class="sr-only"
            type="file"
            multiple
            accept="video/*,image/*,.ply,.spz,.splat,.ksplat,.sog,.las,.laz"
          />
        </label>
      </div>

      <div
        class="track"
        role="progressbar"
        aria-labelledby="status"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="bar" id="bar"></div>
      </div>

      <p id="status" aria-live="polite">Pick a file to start. Photos can be picked together.</p>
      <p id="detail" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/upload/main.ts"></script>
  </body>
</html>
