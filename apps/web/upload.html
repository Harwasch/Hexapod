<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The handoff token rides in the URL fragment. Keep it out of anything that leaves
         the device: no referrer, and nothing here loads a third-party resource. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0c0a" />
    <title>Send a capture</title>
    <style>
      /* The console's palette (packages/ui tokens), inlined: this page loads nothing else. */
      :root {
        color-scheme: dark light;
        --bg: #0b0c0a;
        --surface: #161a13;
        --border: rgba(255, 255, 255, 0.14);
        --fg: #f2f6ef;
        --muted: rgba(242, 246, 239, 0.74);
        --accent: #7fd8c0;
        --on-accent: #0b1410;
        --accent-soft: rgba(127, 216, 192, 0.16);
        --track: rgba(255, 255, 255, 0.12);
        --danger: #f08a7a;
        --danger-soft: rgba(224, 106, 90, 0.16);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6f2;
          --surface: #ffffff;
          --border: rgba(15, 23, 42, 0.12);
          --fg: #0f172a;
          --muted: rgba(15, 23, 42, 0.7);
          --accent: #0d6b57;
          --on-accent: #ffffff;
          --accent-soft: rgba(18, 143, 116, 0.12);
          --track: rgba(15, 23, 42, 0.1);
          --danger: #b3261e;
          --danger-soft: rgba(192, 57, 43, 0.1);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        align-items: center;
        justify-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(140deg, #7fd8c0, #f0b254);
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0 0 6px;
      }
      .lead {
        margin: 0;
        color: var(--muted);
      }
      /* A 56px target: this is used one-handed, on a phone, possibly outdoors. */
      .pick {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 56px;
        padding: 0 20px;
        border-radius: 16px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 1.0625rem;
        font-weight: 650;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .pick:active {
        transform: scale(0.98);
      }
      .pick:focus-within {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .pick:has(input:disabled) {
        opacity: 0.55;
        cursor: progress;
      }
      .kinds {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
      }
      .kinds li {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 12px 6px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        text-align: center;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .kinds li span {
        font-size: 0.8125rem;
        font-weight: 400;
        color: var(--muted);
      }
      .kinds svg {
        margin-bottom: 4px;
      }
      svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .progress {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }
      .track {
        height: 10px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--accent);
        transition: width 120ms linear;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar {
          transition: none;
        }
        .pick:active {
          transform: none;
        }
      }
      #status {
        margin: 0;
        font-weight: 600;
      }
      #detail {
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
        font-variant-numeric: tabular-nums;
      }
      #detail:empty {
        display: none;
      }
      /* Set by main.ts: nothing to track before a file is picked, or when the link is bad. */
      main[data-state="idle"] .track,
      main[data-state="invalid"] .track {
        display: none;
      }
      main[data-state="done"] .progress {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      main[data-state="error"] .progress,
      main[data-state="invalid"] .progress {
        border-color: var(--danger);
        background: var(--danger-soft);
      }
      .foot {
        margin: 0;
        color: var(--muted);
        font-size: 0.8125rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main data-state="idle">
      <header>
        <div class="mark" aria-hidden="true"></div>
      </header>
      <div>
        <h1>Send a capture</h1>
        <p class="lead">It goes straight to the survey. Keep this page open until it’s done.</p>
      </div>

      <div id="form">
        <label class="pick">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 13v8" />
            <path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2" />
            <path d="m8 17 4-4 4 4" />
          </svg>
          Choose files
          <input
            id="file"
            class="sr-only"
            type="file"
            multiple
            accept="video/mp4,video/quicktime,image/jpeg,image/png,.mp4,.mov,.m4v,.avi,.mkv,.webm,.jpg,.jpeg,.png,.ply,.spz"
          />
        </label>
        <ul class="kinds" aria-label="What you can send">
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4" />
            </svg>
            Video<span>3D model</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 22H4a2 2 0 0 1-2-2V6" />
              <path d="m22 13-1.3-1.3a2.4 2.4 0 0 0-3.4 0L11 18" />
              <circle cx="12" cy="8" r="2" />
              <rect width="16" height="16" x="6" y="2" rx="2" />
            </svg>
            Photos<span>3D model</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"
              />
              <path d="m3.3 7 8.7 5 8.7-5M12 22V12" />
            </svg>
            Scan<span>placed as is</span>
          </li>
        </ul>
      </div>

      <section class="progress" aria-label="Upload">
        <p id="status" aria-live="polite">
          Pick a file to start. You can pick several photos at once.
        </p>
        <div
          class="track"
          role="progressbar"
          aria-labelledby="status"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="bar" id="bar"></div>
        </div>
        <p id="detail" aria-live="polite"></p>
      </section>

      <p class="foot">This link only adds files to one capture and expires after 10 minutes.</p>
    </main>
    <script type="module" src="/src/upload/main.ts"></script>
  </body>
</html>
